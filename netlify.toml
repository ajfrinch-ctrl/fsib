# FSIB Branch Marketing Report — Netlify config
#
# Static PWA shell + two Netlify Functions (/api/sync, /api/live) backed by
# Netlify Blobs. The build copies the app shell into public/ so that
# node_modules, src, server and the tests never ship in the deploy.

[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# /api/live is a long-poll: a cached or buffered answer would defeat the point.
# (The Function also sets these on the Response itself, because netlify.toml
# headers only apply to static CDN responses.)
[[headers]]
  for = "/api/live"
  [headers.values]
    Cache-Control = "no-store, no-transform"
    X-Accel-Buffering = "no"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
