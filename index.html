<script>

const K='bmr_v1_', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let settings=JSON.parse(localStorage.getItem(K+'settings')||'null')||{branch:'Tantar Branch',zone:'Cumilla',team:'Team-8',totalBranch:21,target:0,theme:'system',weeklyStart:0,weeklyEnd:4,manager:'Harun Or Rashid',managerDesignation:'Manager',template:'Attn : Head of Treasury.\n\nDaily Report Date : {{date}}\n\n{{team}} ({{zone}} Zone)\n\nTotal Branch: {{branches}}\nReported Branch: {{branch}}\n\nTotal Places Visited: {{visits}}\n\nTotal Deposit: Tk {{deposit}}\n\nRegd.\n\n{{manager}}\n{{managerDesignation}}\n{{branch}}',pin:'',autoLock:0,lastBackup:''};

let records=JSON.parse(localStorage.getItem(K+'records')||'[]'), trash=JSON.parse(localStorage.getItem(K+'trash')||'[]'), deferred, locked=false, activity;

}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){const d=new Date();const year=d.getFullYear();const month=String(d.getMonth()+1).padStart(2,"0");const day=String(d.getDate()).padStart(2,"0");return `${year}-${month}-${day}`;}function num(v){return Number(String(v??'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/,/g,''))||0}function money(n){return num(n).toLocaleString('en-IN',{maximumFractionDigits:2})}function lac(n){return (num(n)/100000).toFixed(2)+' Lac'}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2800)}function dateText(d){return new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}function total(r){return ['cash','clearing','rtgs','npsb','agent'].reduce((a,k)=>a+num(r[k]),0)}function accountsTotal(r){return (r.accounts||[]).reduce((a,x)=>a+num(x.amount),0)}function accountsCount(r){return (r.accounts||[]).filter(x=>x.no).length}function visits(r){return num(r.places)||((r.visits||[]).length)}
function theme(){let dark=settings.theme==='dark'||(settings.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',dark);$('#themeBtn').textContent=dark?'🌙':'☀️'}function setTheme(){settings.theme=document.body.classList.contains('dark')?'light':'dark';save();theme()}$('#themeBtn').onclick=setTheme;
function nav(page){if(page==='entry') renderEntry();if(page==='history')renderHistory();if(page==='reports')renderReports();if(page==='settings')renderSettings();if(page==='dashboard')renderDashboard();$$('.page').forEach(x=>x.classList.toggle('active',x.id===page));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function renderDashboard(){let t=today(), now=records.find(r=>r.date===t), start=new Date();start.setDate(start.getDate()-6);let week=records.filter(r=>new Date(r.date+'T12:00')>=start), month=records.filter(r=>r.date.slice(0,7)===t.slice(0,7)), sum=a=>a.reduce((x,r)=>x+total(r),0), best=[...records].sort((a,b)=>total(b)-total(a))[0], bestV=[...records].sort((a,b)=>visits(b)-visits(a))[0];let officerScores={};records.forEach(r=>(r.officers||[]).forEach(o=>officerScores[o.name]=(officerScores[o.name]||0)+total(r)));let bestO=Object.entries(officerScores).sort((a,b)=>b[1]-a[1])[0];$('#dashboard').innerHTML=`<div class="sectionhead"><div><h2>Dashboard</h2><span class="small">${esc(settings.branch)} · ${esc(settings.zone)}</span></div><span class="small">${dateText(t)}</span></div><div class="grid metrics"><div class="card metric accent"><label>Today’s Deposit</label><strong>৳ ${money(now?total(now):0)}</strong><small>${lac(now?total(now):0)}</small></div><div class="card metric green"><label>Today’s Visits</label><strong>${now?visits(now):0}</strong></div><div class="card metric"><label>Weekly Deposit</label><strong>৳ ${money(sum(week))}</strong></div><div class="card metric"><label>Monthly Deposit</label><strong>৳ ${money(sum(month))}</strong></div><div class="card metric"><label>New Accounts</label><strong>${now?accountsCount(now):0}</strong></div><div class="card metric"><label>Account Deposit</label><strong>৳ ${money(now?accountsTotal(now):0)}</strong></div></div>`}
function officerOpts(v=''){return `<option value="">Select officer</option>`+Object.keys(officers).map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}function officerRow(o={}){return `<div class="repeatrow officer"><select class="oname">${officerOpts(o.name)}</select><input class="odes" readonly placeholder="Designation" value="${esc(o.designation||officers[o.name]||'')}"><button class="remove" type="button">×</button></div>`}function visitRow(v={}){return `<div class="visit repeatrow visitrow"><select class="vofficer">${officerOpts(v.officer||'')}</select><select class="vtype">${['Organization','School','College','Mosque','Madrasa','NGO','Business','Customer','Other'].map(x=>`<option ${x===v.type?'selected':''}>${x}</option>`).join('')}</select><input class="vname" placeholder="Place / institution" value="${esc(v.name||'')}"><input class="vaddress" placeholder="Address" value="${esc(v.address||'')}"><input class="vmobile" inputmode="tel" placeholder="Mobile number" value="${esc(v.mobile||'')}"><button class="remove" type="button">×</button></div>`}function accountRow(a={}){return `<div class="accountrow account"><select class="acat">${['Savings','Current','MTDR','DPS / Other'].map(x=>`<option ${x===a.category?'selected':''}>${x}</option>`).join('')}</select><input class="ano" placeholder="Account number" value="${esc(a.no||'')}"><input class="aamount amount" inputmode="decimal" placeholder="Amount (৳)" value="${esc(a.amount||'')}"><button class="remove" type="button">×</button></div>`}
function renderEntry(record){record=record||JSON.parse(localStorage.getItem(K+'draft')||'null')||{date:today(),officers:[],visits:[],accounts:[]};$('#entry').innerHTML=`<div class="sectionhead"><h2>Daily Data Entry</h2><span class="small" id="draftStatus">Draft ready</span></div><div class="notice">Draft is saved automatically. Tap <b>Save Daily Data</b> to finalize the report.</div><form id="form"><div class="formwide"><div class="formgroup"><label>Date</label><input id="date" type="date" max="${today()}" value="${record.date||today()}"></div><div class="formgroup"><label>Total Places Visited</label><input id="places" class="amount" inputmode="numeric" value="${record.places||''}" placeholder="0"></div><div class="formgroup"><label>Branch</label><input value="${esc(settings.branch)}" readonly></div><div class="formgroup"><label>Zone · Team · Total Branch</label><input value="${esc(settings.zone)} · ${esc(settings.team)} · ${settings.totalBranch}" readonly></div></div><div class="section"><div class="sectiontitle">Officers</div><div id="officers">${(record.officers||[]).map(officerRow).join('')}</div><button class="add" type="button" id="addOfficer">+ Add officer</button></div><div class="section"><div class="sectiontitle">Visit Details</div><div id="visits">${(record.visits||[]).map(visitRow).join('')}</div><button class="add" type="button" id="addVisit">+ Add visit</button></div><div class="section"><div class="sectiontitle">Deposit Entry</div><div class="formwide">${[['cash','Cash'],['clearing','Clearing / BFTN'],['rtgs','RTGS'],['npsb','NPSB'],['agent','Agent Outlet Deposit']].map(([id,l])=>`<div class="formgroup"><label>${l} (৳)</label><input id="${id}" class="amount" inputmode="decimal" value="${record[id]||''}" placeholder="0"></div>`).join('')}<div class="total full">Total Deposit: <b id="depTotal">৳ 0</b> <span class="small" id="depLac"></span></div></div></div><div class="section"><div class="sectiontitle">New Accounts</div><div id="accounts">${(record.accounts||[]).map(accountRow).join('')}</div><button class="add" type="button" id="addAccount">+ Add account</button><div class="total" style="margin-top:9px">Accounts: <b id="acCount">0</b> · Account Deposit: <b id="acTotal">৳ 0</b></div></div><div id="sharePanel"></div><button class="primary" style="width:100%;margin-top:18px" type="submit">Save Daily Data</button></form>`;bindEntry();calcEntry()}
function currentForm(){let f=$('#form');return {date:$('#date').value,places:$('#places').value, cash:$('#cash').value,clearing:$('#clearing').value,rtgs:$('#rtgs').value,npsb:$('#npsb').value,agent:$('#agent').value,officers:$$('.officer').map(x=>({name:x.querySelector('.oname').value,designation:x.querySelector('.odes').value})).filter(x=>x.name),visits:$$('.visit').map(x=>({officer:x.querySelector('.vofficer').value,type:x.querySelector('.vtype').value,name:x.querySelector('.vname').value,address:x.querySelector('.vaddress').value,mobile:x.querySelector('.vmobile').value})).filter(x=>x.name||x.address||x.mobile),accounts:$$('.account').map(x=>({category:x.querySelector('.acat').value,no:x.querySelector('.ano').value.trim(),amount:x.querySelector('.aamount').value})).filter(x=>x.no||x.amount),updated:new Date().toISOString()}}
function message(r){
  let os=(r.officers||[]).map((o,i)=>`${i+1}. ${o.name}, ${o.designation}`).join('\n')||'No officer entered';
  // replaceAll is important: {{branch}} appears both in the report heading and beneath the manager signature.
  const values={date:dateText(r.date),team:settings.team,zone:settings.zone,branches:settings.totalBranch,branch:settings.branch,visits:visits(r),deposit:money(total(r)),manager:settings.manager||'Harun Or Rashid',managerDesignation:settings.managerDesignation||'Manager',officers:os};
  let text=settings.template||treasuryTemplate;
  Object.entries(values).forEach(([key,value])=>text=text.split('{{'+key+'}}').join(String(value)));

}function detailedMessage(r){
  const deposit=[['Cash',r.cash],['Clearing / BFTN',r.clearing],['RTGS',r.rtgs],['NPSB',r.npsb],['Agent Outlet Deposit',r.agent]].filter(x=>num(x[1])>0).map(x=>`${x[0]}: Tk ${money(x[1])}`).join('\n')||'No deposit entry';
  const officerList=(r.officers||[]).map((o,i)=>`${i+1}. ${o.name}, ${o.designation}`).join('\n')||'No officer entry';

/* ============================================================
   JSONBIN FREE EFFICIENT CLOUD SYNC ENGINE
   Offline-First + IndexedDB + Batch Cloud Sync.
   - Local edits NEVER touch the network; they are queued locally.
   - One Sync = at most 1 GET + 1 PUT (PUT only when pendingChanges > 0).
   - No polling. Hard cap: ONE automatic sync per DAY per device
     (AUTO_SYNC_MAX_PER_DAY). The day's single sync is spent only when there
     is real work: pending edits to upload, or a cloud refresh that is due
     after AUTO_REFRESH_DAYS without any cloud contact.
   - Manual "Sync Now" / "Refresh from Cloud" is user-initiated and unlimited;
     a manual sync also counts for that day so no second sync follows.
   ============================================================ */

/* ---------- deterministic serialization + hash (change detection) ---------- */
function stableStringify(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stableStringify).join(',')+']';
  const keys=Object.keys(v).sort();
  return '{'+keys.map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}
function cyrb53(str,seed){
  let h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function genDeviceId(){
  try{
    const a=new Uint8Array(16);crypto.getRandomValues(a);
    a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
    const h=[...a].map(b=>b.toString(16).padStart(2,'0')).join('');
    return 'device-'+h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }catch(e){return 'device-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14);}
}

/* ---------- shared (synced) vs device-local settings ---------- */
const SHARED_SETTING_KEYS=['branch','zone','team','totalBranch','manager','managerDesignation','target','weeklyStart','weeklyEnd','template'];
function pickSharedObj(s){const o={};SHARED_SETTING_KEYS.forEach(k=>{o[k]=(s||{})[k];});return o;}
function sharedSettings(s){return pickSharedObj(s||settings);}
function canonicalSyncContent(o){
  const recs=(o.records||[]).map(r=>({date:r.date,places:r.places||'',cash:r.cash||'',clearing:r.clearing||'',rtgs:r.rtgs||'',npsb:r.npsb||'',agent:r.agent||'',officers:r.officers||[],visits:r.visits||[],accounts:r.accounts||[],updated:r.updated||'',created:r.created||''})).sort((a,b)=>(a.date<b.date?-1:1));
  const tra=(o.trash||[]).filter(r=>r&&r.date).map(r=>({date:r.date,deleted:r.deleted||'',updated:r.updated||''})).sort((a,b)=>(a.date<b.date?-1:1));
  const tom=(o.tombstones||[]).filter(t=>t&&(t.recordId||t.date)).map(t=>({recordId:t.recordId||t.date,date:t.date||t.recordId,deletedAt:t.deletedAt||''})).sort((a,b)=>(a.recordId<b.recordId?-1:1));
  const set=o.settings_sync?pickSharedObj(o.settings_sync):sharedSettings(o.settings);
  return {records:recs,trash:tra,tombstones:tom,settings:set};
}
function computeLocalHash(){try{return cyrb53(stableStringify(canonicalSyncContent({records:records,trash:trash,tombstones:tombstones})));}catch(e){return '';}}
function cloudContentHash(cloud){
  if(!cloud)return '';
  try{return cyrb53(stableStringify(canonicalSyncContent({records:cloud.records||[],trash:cloud.trash||[],tombstones:cloud.tombstones||[],settings_sync:cloud.settings_sync||sharedSettings(cloud.settings||{})})));}catch(e){return '';}
}

/* ---------- IndexedDB (primary local database) ---------- */
const IDB_NAME='fsib_marketing_db',IDB_VER=1;
let _idb=null;
let _meta={},_queue=[],_syncLog=[],tombstones=[];
let _syncStatus='synced',_syncInProgress=false,_lastSyncError='';
let _debounceT=null,_qPersistT=null,_persistT=null;
let _qChain=Promise.resolve(),_persistChain=Promise.resolve(),_rateWarned=false;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window))return rej(new Error('no-idb'));
    let rq;try{rq=indexedDB.open(IDB_NAME,IDB_VER);}catch(e){return rej(e);}
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('appData'))db.createObjectStore('appData',{keyPath:'key'});
      if(!db.objectStoreNames.contains('syncMeta'))db.createObjectStore('syncMeta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('syncQueue')){const q=db.createObjectStore('syncQueue',{keyPath:'id',autoIncrement:true});q.createIndex('recordKey','recordKey',{unique:false});}
      if(!db.objectStoreNames.contains('syncLog'))db.createObjectStore('syncLog',{keyPath:'id',autoIncrement:true});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('idb-open'));
    rq.onblocked=()=>rej(new Error('idb-blocked'));
  });
}
function idbReq(store,mode,fn){
  return new Promise((res,rej)=>{
    if(!_idb)return rej(new Error('no-db'));
    let tx;try{tx=_idb.transaction(store,mode);}catch(e){return rej(e);}
    let rq;try{rq=fn(tx.objectStore(store));}catch(e){return rej(e);}
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('idb-req'));
  });
}
async function kvGet(key){try{const r=await idbReq('appData','readonly',s=>s.get(key));return r?r.value:undefined;}catch(e){return undefined;}}
async function kvPut(key,value){try{await idbReq('appData','readwrite',s=>s.put({key:key,value:value}));}catch(e){}}

/* ---------- syncMeta (in-memory + IndexedDB + localStorage mirror) ---------- */
async function metaLoadAll(){
  let stored={};
  try{const all=await idbReq('syncMeta','readonly',s=>s.getAll());(all||[]).forEach(r=>{stored[r.key]=r.value;});}catch(e){}
  try{const ls=JSON.parse(localStorage.getItem(K+'syncMeta')||'null');if(ls&&typeof ls==='object')stored={...ls,...stored};}catch(e){}
  _meta={...stored,..._meta};
  return _meta;
}
async function metaPut(key,value){
  _meta[key]=value;
  try{await idbReq('syncMeta','readwrite',s=>s.put({key:key,value:value}));}catch(e){}
  try{localStorage.setItem(K+'syncMeta',JSON.stringify(_meta));}catch(e){}
}

/* ---------- syncQueue (only locally-changed records) ---------- */
function mergeQueueRows(a,b){
  const map=new Map();
  (a||[]).concat(b||[]).forEach(q=>{
    if(!q||!q.recordKey||q.syncStatus!=='PENDING')return;
    const cur=map.get(q.recordKey);
    if(!cur||(q.changedAt||'')>=(cur.changedAt||''))map.set(q.recordKey,q);
  });
  return [...map.values()];
}
async function queueLoadAll(){
  let rows=[];
  try{rows=await idbReq('syncQueue','readonly',s=>s.getAll())||[];}catch(e){rows=[];}
  if(!rows.length){try{rows=JSON.parse(localStorage.getItem(K+'queue')||'[]');}catch(e){rows=[];}}
  _queue=mergeQueueRows(rows,_queue);
  return _queue;
}
function _persistQueueInner(){
  return (async()=>{
    if(!_idb)return;
    try{
      const tx=_idb.transaction('syncQueue','readwrite');const st=tx.objectStore('syncQueue');
      await new Promise((res,rej)=>{const c=st.clear();c.onsuccess=()=>res();c.onerror=()=>rej(c.error);});
      const snap=[..._queue];
      for(const q of snap){const cpy={...q};delete cpy.id;await new Promise((res,rej)=>{const a=st.add(cpy);a.onsuccess=()=>res();a.onerror=()=>rej(a.error);});}
    }catch(e){}
  })();
}
function persistQueueNow(){
  try{localStorage.setItem(K+'queue',JSON.stringify(_queue));}catch(e){}
  _qChain=_qChain.then(_persistQueueInner).catch(()=>{});return _qChain;
}
function persistQueueSoon(){
  try{localStorage.setItem(K+'queue',JSON.stringify(_queue));}catch(e){}
  clearTimeout(_qPersistT);_qPersistT=setTimeout(()=>{persistQueueNow().catch(()=>{});},400);
}
function upsertQueue(entry){
  const rk=entry.store+':'+entry.recordId;
  const i=_queue.findIndex(q=>q.recordKey===rk);
  if(entry.operation==='DELETE'&&i>=0&&_queue[i].operation==='CREATE'){_queue.splice(i,1);}
  else if(i>=0){
    const prev=_queue[i].operation;let op=entry.operation;
    if(prev==='CREATE'&&op==='UPDATE')op='CREATE';
    if(prev==='DELETE'&&(op==='CREATE'||op==='UPDATE'))op='UPDATE';
    _queue[i]={..._queue[i],operation:op,changedAt:entry.changedAt,payload:entry.payload,syncStatus:'PENDING'};
  }else{
    _queue.push({recordKey:rk,store:entry.store,recordId:entry.recordId,operation:entry.operation,changedAt:entry.changedAt,payload:entry.payload,syncStatus:'PENDING'});
  }
  persistQueueSoon();
}
function pendingCount(){return (_queue||[]).filter(q=>q.syncStatus==='PENDING').length;}
async function getPendingChanges(){return [...(_queue||[])].filter(q=>q.syncStatus==='PENDING').sort((a,b)=>(a.changedAt<b.changedAt?-1:1));}
async function markChangesAsSynced(snapshot){
  const map=new Map((snapshot||[]).map(s=>[s.recordKey,s.changedAt]));
  _queue=(_queue||[]).filter(q=>{
    if(!map.has(q.recordKey))return true;
    return (q.changedAt||'')>(map.get(q.recordKey)||'');
  });
  await persistQueueNow();
  _meta.pendingChanges=pendingCount();
  await metaPut('pendingChanges',_meta.pendingChanges);
}
function queueRecordChange(date,op,rec){
  try{
    const ti=tombstones.findIndex(t=>(t.recordId||t.date)===date);
    if(ti>=0){tombstones.splice(ti,1);kvPut('tombstones',tombstones);try{localStorage.setItem(K+'tombstones',JSON.stringify(tombstones));}catch(e){}}
    upsertQueue({store:'records',recordId:date,operation:op,changedAt:(rec&&rec.updated)||new Date().toISOString(),payload:JSON.parse(JSON.stringify(rec))});
  }catch(e){}
  markDirtyAndSchedule();
}
function queueRecordDelete(date){
  try{
    const now=new Date().toISOString();
    const tomb={recordId:date,date:date,deleted:true,deletedAt:now,deviceId:_meta.deviceId||''};
    const ti=tombstones.findIndex(t=>(t.recordId||t.date)===date);
    if(ti>=0)tombstones[ti]=tomb;else tombstones.push(tomb);
    kvPut('tombstones',tombstones);try{localStorage.setItem(K+'tombstones',JSON.stringify(tombstones));}catch(e){}
    upsertQueue({store:'records',recordId:date,operation:'DELETE',changedAt:now,payload:tomb});
  }catch(e){}
  markDirtyAndSchedule();
}
function queueSettingsChange(){
  try{upsertQueue({store:'settings',recordId:'shared',operation:'UPDATE',changedAt:settings.settingsUpdatedAt||new Date().toISOString(),payload:sharedSettings()});}catch(e){}
  markDirtyAndSchedule();
}

/* ---------- local persistence (IndexedDB primary, localStorage mirror) ---------- */
function persistLocalAsync(immediate){
  if(immediate){_persistChain=_persistChain.then(persistLocalInner).catch(()=>{});return _persistChain;}
  clearTimeout(_persistT);_persistT=setTimeout(()=>{_persistChain=_persistChain.then(persistLocalInner).catch(()=>{});},250);
}
async function persistLocalInner(){
  await kvPut('records',records);await kvPut('trash',trash);await kvPut('settings',settings);await kvPut('tombstones',tombstones);
}

/* ---------- daily auto-sync gate: at most ONE cloud sync per day ----------
   - _meta.syncDayUsed = the local day (YYYY-MM-DD) whose single sync is already spent.
   - The day is spent the moment a request actually reaches the cloud (auto OR manual),
     so a manual sync never triggers a second automatic sync the same day.
   - Offline / no-key / busy / nothing-to-do decisions make NO request and do NOT spend it. */
function dayKeyOf(d){
  const x=d?new Date(d):new Date();
  if(!x||isNaN(x.getTime()))return '';
  const p=n=>String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
}
function syncDayUsedToday(){return (_meta.syncDayUsed||'')===dayKeyOf();}
function markSyncDayUsed(){
  if((_meta.syncDayUsed||'')===dayKeyOf())return;
  _meta.syncDayUsed=dayKeyOf();metaPut('syncDayUsed',_meta.syncDayUsed);
}
function releaseSyncDay(){_meta.syncDayUsed='';metaPut('syncDayUsed','');}
function markAutoSyncFired(){
  const now=new Date().toISOString();
  _meta.lastAutoSyncAt=now;metaPut('lastAutoSyncAt',now);
  markSyncDayUsed();
}
function noteCloudContact(){
  const now=new Date().toISOString();
  _meta.lastCloudContactAt=now;metaPut('lastCloudContactAt',now);
  markSyncDayUsed();
}
function daysSinceCloudContact(){
  const at=_meta.lastCloudContactAt||_meta.lastSyncAt||settings.lastSync||'';
  if(!at)return 9999;
  const t=new Date(at).getTime();
  if(isNaN(t))return 9999;

}
function isDailyAutoReason(r){return r==='daily-upload'||r==='daily-refresh';}
function dailyAutoTarget(){
  if(pendingCount()>0)return 'daily-upload';
  if(daysSinceCloudContact()>=(SYNC_CONFIG.AUTO_REFRESH_DAYS||3))return 'daily-refresh';
  return '';
}
function dailyAutoSyncDue(){
  if(!settings.autoSync)return false;
  try{if(getViewBinFromUrl())return false;}catch(e){}
  if(!navigator.onLine||!getJsonbinKey())return false;
  if(syncDayUsedToday())return false;

}
function maybeDailyAutoSync(trigger){
  if(_syncInProgress)return false;

}
function autoSyncStatusText(){
  if(!settings.autoSync)return 'Off';
  if(syncDayUsedToday())return 'used today \u00b7 next auto sync tomorrow';
  const due=!!dailyAutoTarget();

/* ---------- dirty state + conservative auto-sync (debounced, never polling) ---------- */
function markDirtyAndSchedule(){
  const n=pendingCount();
  _meta.pendingChanges=n;
  if(!navigator.onLine)_syncStatus='offline';
  else if(!_syncInProgress)_syncStatus=n>0?'pending':(_syncStatus==='error'?'error':'synced');
  metaPut('pendingChanges',n);metaPut('syncStatus',_syncStatus);
  updateSyncUI();

}
function scheduleDebouncedSync(){

  if(!settings.autoSync)return;
  try{if(getViewBinFromUrl())return;}catch(e){}
  if(!navigator.onLine||!getJsonbinKey())return;
  if(syncDayUsedToday())return;

}
function setSyncStatus(s,err){

/* ---------- request budget + rate-limit awareness ---------- */
function noteRequest(){
  _meta.requestsUsed=(_meta.requestsUsed||0)+1;
  _meta.requestsSinceLastReset=(_meta.requestsSinceLastReset||0)+1;
  metaPut('requestsUsed',_meta.requestsUsed);metaPut('requestsSinceLastReset',_meta.requestsSinceLastReset);
}
function noteRateHeaders(h){
  try{
    const rem=h.get('x-ratelimit-remaining'),lim=h.get('x-ratelimit-limit'),rst=h.get('x-ratelimit-reset');
    if(rem===null&&lim===null)return;
    _meta.lastRateLimit={remaining:rem!==null?Number(rem):null,limit:lim!==null?Number(lim):null,reset:rst||null,at:new Date().toISOString()};
    metaPut('lastRateLimit',_meta.lastRateLimit);
    if(_meta.lastRateLimit.remaining!==null&&_meta.lastRateLimit.remaining<=100&&!_rateWarned){
      _rateWarned=true;
      toast('Cloud request allowance nearly exhausted ('+_meta.lastRateLimit.remaining+' left). Sync sparingly.');
    }
    if(_meta.lastRateLimit.remaining===0)toast('Cloud request limit reached. Changes remain saved locally.');
  }catch(e){}
}

/* ---------- JSONBin transport (least-privilege header first) ---------- */
async function fetchJsonbin(path,opts){
  opts=opts||{};
  const key=getJsonbinKey();
  const mkHeaders=useMaster=>{const h={'Content-Type':'application/json'};if(key)h[useMaster?'X-Master-Key':'X-Access-Key']=key;if(opts.binPrivate===false)h['X-Bin-Private']='false';if(opts.binName)h['X-Bin-Name']=opts.binName;return h;};
  const doFetch=async useMaster=>{
    const r=await fetch(SYNC_CONFIG.API_BASE+path,{method:opts.method||'GET',headers:mkHeaders(useMaster),body:opts.body});
    noteRequest();noteRateHeaders(r.headers);
    return r;
  };
  let r=await doFetch(false);
  if((r.status===401||r.status===403)&&SYNC_CONFIG.USE_MASTER_HEADER_FALLBACK&&key){
    const r2=await doFetch(true);
    addSyncLog('auth','Retried with alternate credential header ('+r.status+' -> '+r2.status+').');
    r=r2;
  }
  return r;
}
async function cloudGet(bin){
  const r=await fetchJsonbin('/b/'+encodeURIComponent(bin)+'/latest',{method:'GET'});
  if(r.status===404)return {notFound:true};
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('GET '+r.status+' '+String(t||'').slice(0,120));}
  const j=await r.json();
  return {data:(j&&(j.record||j))||null,raw:j};
}
async function cloudPut(bin,payload){
  const r=await fetchJsonbin('/b/'+encodeURIComponent(bin),{method:'PUT',body:JSON.stringify(payload)});
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('PUT '+r.status+' '+String(t||'').slice(0,160));}
  return r.json().catch(()=>({}));
}
async function cloudCreate(payload){
  const r=await fetchJsonbin('/b',{method:'POST',body:JSON.stringify(payload),binName:SYNC_CONFIG.BIN_NAME,binPrivate:false});
  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('POST '+r.status+' '+String(t||'').slice(0,160));}
  return r.json();
}

/* ---------- merge (multi-device, conflict-aware, newest-wins, never drop) ---------- */
function unionRecords(a,b,tsKey){
  const map=new Map();const tk=tsKey||'updated';
  (a||[]).forEach(r=>{if(r&&r.date)map.set(r.date,r);});
  (b||[]).forEach(r=>{
    if(!r||!r.date)return;
    if(!map.has(r.date)){map.set(r.date,r);return;}
    const cur=map.get(r.date);
    if((r[tk]||'')>(cur[tk]||''))map.set(r.date,r);
  });
  return [...map.values()].sort((x,y)=>(x.date<y.date?-1:1));
}
function unionTombstones(a,b){
  const map=new Map();
  (a||[]).concat(b||[]).forEach(t=>{
    const k=t&&(t.recordId||t.date);if(!k)return;
    const cur=map.get(k);
    if(!cur||(t.deletedAt||'')>(cur.deletedAt||''))map.set(k,t);
  });
  return [...map.values()];
}
function pruneTombstones(list){
  const maxMs=(SYNC_CONFIG.TOMBSTONE_RETENTION_DAYS||90)*864e5;const now=Date.now();
  return (list||[]).filter(t=>{const d=Date.parse(t.deletedAt||0)||0;return (now-d)<maxMs;});
}
function mergeLocalAndCloud(cloud,pending){
  const cloudRecords=Array.isArray(cloud&&cloud.records)?cloud.records:[];
  const cloudTrash=Array.isArray(cloud&&cloud.trash)?cloud.trash:[];
  const cloudTombs=Array.isArray(cloud&&cloud.tombstones)?cloud.tombstones:[];
  const byDate=new Map();
  cloudRecords.forEach(r=>{if(r&&r.date)byDate.set(r.date,r);});
  const tombByDate=new Map();
  cloudTombs.forEach(t=>{const k=t&&(t.recordId||t.date);if(k)tombByDate.set(k,t);});
  tombstones.forEach(t=>{const k=t&&(t.recordId||t.date);if(!k)return;const c=tombByDate.get(k);if(!c||(t.deletedAt||'')>(c.deletedAt||''))tombByDate.set(k,t);});
  const conflicts=[];
  const ops=[...(pending||[])].filter(q=>q.store==='records').sort((a,b)=>(a.changedAt<b.changedAt?-1:1));
  ops.forEach(q=>{
    const rid=q.recordId;
    if(q.operation==='DELETE'){
      const tomb=q.payload||{recordId:rid,date:rid,deleted:true,deletedAt:q.changedAt};
      const cur=byDate.get(rid);
      const delAt=tomb.deletedAt||q.changedAt||'';
      if(!cur||delAt>=(cur.updated||'')){byDate.delete(rid);tombByDate.set(rid,{recordId:rid,date:rid,deleted:true,deletedAt:delAt});}
      else conflicts.push({recordId:rid,reason:'delete-vs-newer-cloud',kept:'cloud',attemptedDelete:{recordId:rid,deletedAt:delAt},at:new Date().toISOString()});
    }else{
      const rec=q.payload;if(!rec||!rec.date)return;
      const cur=byDate.get(rid);
      const tomb=tombByDate.get(rid);
      if(tomb&&(tomb.deletedAt||'')>(rec.updated||'')){conflicts.push({recordId:rid,reason:'cloud-delete-newer',kept:'deleted',local:rec,at:new Date().toISOString()});return;}
      if(!cur){byDate.set(rid,rec);tombByDate.delete(rid);}
      else if((rec.updated||'')>=(cur.updated||'')){byDate.set(rid,rec);tombByDate.delete(rid);}
      else conflicts.push({recordId:rid,reason:'both-modified',kept:'cloud',localUpdated:rec.updated||'',cloudUpdated:cur.updated||'',local:rec,at:new Date().toISOString()});
    }
  });
  records.forEach(r=>{
    if(!r||!r.date||byDate.has(r.date))return;
    const t=tombByDate.get(r.date);
    if(!t||(r.updated||'')>(t.deletedAt||'')){byDate.set(r.date,r);tombByDate.delete(r.date);}
  });
  const trashMap=new Map();
  cloudTrash.forEach(t=>{if(t&&t.date)trashMap.set(t.date,t);});
  trash.forEach(t=>{if(!t||!t.date)return;const c=trashMap.get(t.date);if(!c||(t.deleted||'')>=(c.deleted||''))trashMap.set(t.date,t);});
  const cloudSet=(cloud&&(cloud.settings_sync||sharedSettings(cloud.settings||{})))||{};
  const cloudSetAt=(cloud&&(cloud.settingsUpdatedAt||cloud.updated_at))||'';
  const localSetAt=settings.settingsUpdatedAt||'';
  let mergedSettings,settingsAt;
  if(localSetAt>=cloudSetAt){mergedSettings=sharedSettings();settingsAt=localSetAt||new Date().toISOString();}
  else{mergedSettings=pickSharedObj(cloudSet);settingsAt=cloudSetAt;}
  return {
    records:[...byDate.values()].sort((a,b)=>(a.date<b.date?-1:1)),
    trash:[...trashMap.values()].sort((a,b)=>(a.date<b.date?-1:1)),
    tombstones:pruneTombstones([...tombByDate.values()]),
    settings_sync:mergedSettings,settingsUpdatedAt:settingsAt,
    conflicts:conflicts
  };
}
function buildCloudPayload(merged,prevCloud){
  const now=new Date().toISOString();
  const revision=((prevCloud&&prevCloud.revision)||_meta.lastCloudRevision||0)+1;
  return {app:'FSIB Marketing',schemaVersion:SYNC_CONFIG.SCHEMA_VERSION,revision:revision,updated_at:now,lastWriter:_meta.deviceId||'',
    records:merged.records,trash:merged.trash,tombstones:merged.tombstones,
    settings_sync:merged.settings_sync,settingsUpdatedAt:merged.settingsUpdatedAt,partitions:null};
}
function applyCloudToLocal(cloud){
  let added=0,updatedN=0;
  const incoming=Array.isArray(cloud.records)?cloud.records:[];
  const tombs=Array.isArray(cloud.tombstones)?cloud.tombstones:[];
  const tombSet=new Set(tombs.map(t=>t.recordId||t.date).filter(Boolean));
  const inMap=new Map();incoming.forEach(r=>{if(r&&r.date)inMap.set(r.date,r);});
  const before=new Map(records.map(r=>[r.date,r]));
  const next=[];
  inMap.forEach(r=>{next.push(r);});
  records.forEach(r=>{if(r&&r.date&&!inMap.has(r.date)&&!tombSet.has(r.date))next.push(r);});
  next.forEach(r=>{if(!before.has(r.date))added++;else if((r.updated||'')!==(before.get(r.date).updated||''))updatedN++;});
  next.sort((a,b)=>(a.date<b.date?-1:1));
  records=next;
  trash=unionRecords(trash,Array.isArray(cloud.trash)?cloud.trash:[],'deleted');
  tombstones=pruneTombstones(unionTombstones(tombstones,tombs));
  const cloudSetAt=cloud.settingsUpdatedAt||cloud.updated_at||'';
  if((cloudSetAt||'')>(settings.settingsUpdatedAt||'')){
    const cs=cloud.settings_sync||sharedSettings(cloud.settings||{});
    SHARED_SETTING_KEYS.forEach(k=>{if(cs[k]!==undefined)settings[k]=cs[k];});
    settings.settingsUpdatedAt=cloudSetAt;
  }
  save();
  return {added:added,updated:updatedN};
}
function adoptMergedLocally(merged){
  records=[...(merged.records||[])];
  trash=[...(merged.trash||[])];
  tombstones=pruneTombstones([...(merged.tombstones||[])]);
  const at=merged.settingsUpdatedAt||'';
  if((at||'')>=(settings.settingsUpdatedAt||'')){
    SHARED_SETTING_KEYS.forEach(k=>{if(merged.settings_sync&&merged.settings_sync[k]!==undefined)settings[k]=merged.settings_sync[k];});
    settings.settingsUpdatedAt=at;
  }
  save();
}
function reapplyLeftovers(){
  if(!_queue.length)return;
  const ops=[..._queue].sort((a,b)=>(a.changedAt<b.changedAt?-1:1));
  ops.forEach(q=>{
    if(q.store==='settings'){const p=q.payload||{};SHARED_SETTING_KEYS.forEach(k=>{if(p[k]!==undefined)settings[k]=p[k];});settings.settingsUpdatedAt=q.changedAt;return;}
    if(q.store!=='records')return;
    if(q.operation==='DELETE'){records=records.filter(r=>r.date!==q.recordId);return;}
    const rec=q.payload;if(!rec||!rec.date)return;
    const i=records.findIndex(r=>r.date===rec.date);
    if(i>=0)records[i]=rec;else records.push(rec);
  });
  records.sort((a,b)=>(a.date<b.date?-1:1));
  save();
}
function sizeGuard(payload){
  let bytes=0;try{bytes=JSON.stringify(payload).length;}catch(e){}
  _meta.lastPayloadBytes=bytes;
  if(bytes>(SYNC_CONFIG.MAX_PAYLOAD_BYTES||400000)){
    addSyncLog('Cloud data large','Payload ~'+Math.round(bytes/1024)+' KB approaches the JSONBin record-size limit. Use Backup, then delete very old months from History to shrink the single primary bin.');
    toast('Cloud data is large (~'+Math.round(bytes/1024)+' KB). Consider archiving old months.');
  }
  return bytes;
}
function onBinCreated(newId,payload){
  setBinId(newId);
  try{
    const link=location.origin+location.pathname.replace(/index\.html$/,'')+'?view='+encodeURIComponent(newId);
    settings.publicLink=link;settings.binId=newId;
    localStorage.setItem(K+'settings',JSON.stringify(settings));
  }catch(e){}
  if(!SYNC_CONFIG.BIN_ID){
    alert('IMPORTANT \u2014 Cloud Bin ID created:\n\n'+newId+'\n\nPut this in index.html as SYNC_CONFIG.BIN_ID so all mobiles share the same data.');
    toast('Bin ID created \u2014 see alert');
  }else toast('Synced to cloud');
  try{if(navigator.clipboard&&settings.publicLink)navigator.clipboard.writeText(settings.publicLink).catch(()=>{});}catch(e){}
}

/* ---------- the request-efficient sync algorithm ---------- */
async function syncNow(reason){
  reason=reason||'manual';
  const dailyAuto=isDailyAutoReason(reason);
  try{if(getViewBinFromUrl())return {skipped:'public-view'};}catch(e){}
  if(_syncInProgress)return {skipped:'busy'};
  if(!navigator.onLine){setSyncStatus('offline');if(!dailyAuto)toast('Offline \u2014 changes saved locally');return {offline:true};}
  if(!getJsonbinKey()){if(reason==='manual'||reason==='refresh')toast('Cloud key missing \u2014 contact admin');return {noKey:true};}
  if(dailyAuto&&syncDayUsedToday())return {skipped:'daily-limit'};
  /* spend the day's single sync BEFORE the first possible network call */
  if(dailyAuto)markAutoSyncFired();
  _syncInProgress=true;setSyncStatus('syncing');
  const startedAt=new Date().toISOString();
  try{
    const pending=await getPendingChanges();
    const needsUpload=pending.length>0;
    const localHash=computeLocalHash();
    const lastHash=_meta.lastCloudHash||'';
    const explicit=(reason==='manual'||reason==='refresh');
    const wantsCloudCheck=(reason==='startup'||reason==='online'||explicit||needsUpload||reason==='retry'||dailyAuto);
    if(!needsUpload&&!wantsCloudCheck){setSyncStatus(pendingCount()>0?'pending':'synced');return {noop:true};}
    if(!needsUpload&&localHash&&localHash===lastHash&&!explicit&&reason!=='startup'&&reason!=='online'&&!dailyAuto){setSyncStatus('synced');return {noop:true};}
    let bin=getBinId();
    if(!bin){
      if(!needsUpload){if(dailyAuto)releaseSyncDay();setSyncStatus('synced');return {noop:true};}
      const merged0=mergeLocalAndCloud(null,pending);
      const payload0=buildCloudPayload(merged0,null);
      sizeGuard(payload0);
      const created=await cloudCreate(payload0);
      const newId=(created&&(created.metadata&&created.metadata.id))||'';
      if(!newId)throw new Error('create returned no id');
      onBinCreated(newId,payload0);
      await markChangesAsSynced(pending.map(p=>({recordKey:p.recordKey,changedAt:p.changedAt})));
      adoptMergedLocally(merged0);
      reapplyLeftovers();
      await metaPut('lastCloudHash',cloudContentHash(payload0));await metaPut('lastCloudRevision',payload0.revision);await metaPut('lastCloudUpdatedAt',payload0.updated_at);
      settings.lastSync=payload0.updated_at;await metaPut('lastSyncAt',payload0.updated_at);
      await addSyncLog('Sync successful','Bin created. Records uploaded: '+pending.length,{uploaded:pending.length});
      setSyncStatus(pendingCount()>0?'pending':'synced');
      refreshAfterSync();
      if(dailyAuto)toast('Daily auto sync done \u2014 next automatic sync tomorrow');
      return {created:true,uploaded:pending.length};
    }
    let cloud=null,gotCloud=false,notFound=false;
    if(wantsCloudCheck){
      const g=await cloudGet(bin);
      if(g.notFound)notFound=true;else{cloud=g.data;gotCloud=true;}
    }
    if(notFound){
      const mergedN=mergeLocalAndCloud(null,pendingCount()?pending:[]);
      const payloadN=buildCloudPayload(mergedN,null);
      sizeGuard(payloadN);
      const created=await cloudCreate(payloadN);
      const newId=(created&&(created.metadata&&created.metadata.id))||'';
      if(!newId)throw new Error('recreate returned no id');
      onBinCreated(newId,payloadN);
      if(pending.length)await markChangesAsSynced(pending.map(p=>({recordKey:p.recordKey,changedAt:p.changedAt})));
      reapplyLeftovers();adoptMergedLocally(mergedN);
      await metaPut('lastCloudHash',cloudContentHash(payloadN));await metaPut('lastCloudRevision',payloadN.revision);await metaPut('lastCloudUpdatedAt',payloadN.updated_at);
      settings.lastSync=payloadN.updated_at;await metaPut('lastSyncAt',payloadN.updated_at);
      await addSyncLog('Sync successful','Cloud bin recreated. Records uploaded: '+pending.length,{uploaded:pending.length});
      setSyncStatus(pendingCount()>0?'pending':'synced');refreshAfterSync();
      if(dailyAuto)toast('Daily auto sync done \u2014 next automatic sync tomorrow');
      return {recreated:true,uploaded:pending.length};
    }
    const cloudHash=gotCloud?cloudContentHash(cloud):lastHash;
    const cloudChanged=gotCloud&&cloudHash!==(lastHash||'__none__');
    if(!needsUpload){
      if(!gotCloud||!cloudChanged){setSyncStatus('synced');return {noop:true};}
      const applied=applyCloudToLocal(cloud||{});
      await metaPut('lastCloudHash',cloudHash);await metaPut('lastCloudRevision',(cloud&&cloud.revision)||_meta.lastCloudRevision||0);await metaPut('lastCloudUpdatedAt',(cloud&&cloud.updated_at)||startedAt);
      settings.lastSync=new Date().toISOString();await metaPut('lastSyncAt',settings.lastSync);
      try{localStorage.setItem(K+'settings',JSON.stringify(settings));}catch(e){}await kvPut('settings',settings);
      await addSyncLog('Sync successful','Downloaded cloud changes. New: '+applied.added+', updated: '+applied.updated,{downloaded:applied.added+applied.updated});
      setSyncStatus('synced');refreshAfterSync();
      if(explicit||reason==='startup')toast('Synced from cloud ('+records.length+' records)');
      else if(dailyAuto)toast((applied.added+applied.updated)>0?('Daily auto sync done \u2014 '+(applied.added+applied.updated)+' cloud change(s) downloaded'):'Daily auto sync done \u2014 next automatic sync tomorrow');
      return {downloaded:applied};
    }
    if(gotCloud&&!cloudChanged&&localHash===cloudHash){
      await markChangesAsSynced(pending.map(p=>({recordKey:p.recordKey,changedAt:p.changedAt})));
      setSyncStatus(pendingCount()>0?'pending':'synced');return {noop:true};
    }
    const merged=mergeLocalAndCloud(cloud,pending);
    const payload=buildCloudPayload(merged,cloud);
    sizeGuard(payload);
    await cloudPut(bin,payload);
    await markChangesAsSynced(pending.map(p=>({recordKey:p.recordKey,changedAt:p.changedAt})));
    adoptMergedLocally(merged);
    reapplyLeftovers();
    if(merged.conflicts&&merged.conflicts.length){
      const prev=Array.isArray(_meta.conflicts)?_meta.conflicts:[];
      await metaPut('conflicts',merged.conflicts.concat(prev).slice(0,20));
      await addSyncLog('Conflicts resolved',merged.conflicts.length+' conflicting record(s) \u2014 newest kept: '+merged.conflicts.map(c=>c.recordId).join(', '));
    }
    await metaPut('lastCloudHash',cloudContentHash(payload));await metaPut('lastCloudRevision',payload.revision);await metaPut('lastCloudUpdatedAt',payload.updated_at);
    settings.lastSync=payload.updated_at;await metaPut('lastSyncAt',payload.updated_at);
    try{localStorage.setItem(K+'settings',JSON.stringify(settings));}catch(e){}await kvPut('settings',settings);
    await addSyncLog('Sync successful','Records uploaded: '+pending.length+(gotCloud&&cloudChanged?' \u00b7 Cloud changes merged':''),{uploaded:pending.length});
    setSyncStatus(pendingCount()>0?'pending':'synced');
    refreshAfterSync();
    if(explicit||reason==='startup')toast('Synced ('+pending.length+' uploaded)');
    else if(dailyAuto)toast('Daily auto sync done \u2014 '+pending.length+' uploaded, next automatic sync tomorrow');
    return {uploaded:pending.length,downloaded:cloudChanged};
  }catch(err){
    console.error('sync failed',err);
    setSyncStatus('error',(err&&err.message)||'error');
    await addSyncLog('Sync failed',String((err&&err.message)||err).slice(0,180)+' \u2014 local data is safe, '+pendingCount()+' change(s) waiting.');
    if(reason==='manual'||reason==='refresh'||reason==='retry')toast('Sync failed. Your local data is safe. '+pendingCount()+' change(s) waiting to sync.');
    else if(dailyAuto)toast('Auto sync failed \u2014 today\u2019s automatic sync is used up. Data is safe locally; tap \u2601 Sync Now to retry.');
    return {error:err};
  }finally{
    _syncInProgress=false;updateSyncUI();
  }
}

/* ---------- sync log (local only, capped) ---------- */
async function addSyncLog(event,detail,extra){
  const e={at:new Date().toISOString(),event:event,detail:detail||'',uploaded:(extra&&extra.uploaded)||0,downloaded:(extra&&extra.downloaded)||0};
  _syncLog.unshift(e);_syncLog=_syncLog.slice(0,SYNC_CONFIG.MAX_SYNC_LOG||30);
  try{localStorage.setItem(K+'syncLog',JSON.stringify(_syncLog));}catch(e){}
  if(_idb){try{
    await new Promise((res,rej)=>{const a=_idb.transaction('syncLog','readwrite').objectStore('syncLog').add(e);a.onsuccess=()=>res();a.onerror=()=>rej(a.error);});
    const all=await idbReq('syncLog','readonly',s=>s.getAll());
    if(all&&all.length>(SYNC_CONFIG.MAX_SYNC_LOG||30)){
      const over=all.slice(0,all.length-(SYNC_CONFIG.MAX_SYNC_LOG||30));
      const tx2=_idb.transaction('syncLog','readwrite');over.forEach(r=>tx2.objectStore('syncLog').delete(r.id));
    }
  }catch(e){}}
  updateSyncUI();
}
async function loadSyncLog(){
  try{const all=await idbReq('syncLog','readonly',s=>s.getAll());if(all&&all.length){_syncLog=all.sort((a,b)=>(a.at<b.at?1:-1)).slice(0,SYNC_CONFIG.MAX_SYNC_LOG||30);return _syncLog;}}catch(e){}
  try{_syncLog=JSON.parse(localStorage.getItem(K+'syncLog')||'[]');}catch(e){_syncLog=[];}
  return _syncLog;
}

/* ---------- migration: LocalStorage -> IndexedDB (once, data preserved) ---------- */
async function initLocalDB(){
  try{_idb=await idbOpen();}catch(e){_idb=null;}
  await metaLoadAll();
  if(!_meta.deviceId){
    let dev='';try{dev=localStorage.getItem(K+'deviceId')||'';}catch(e){}
    if(!dev)dev=genDeviceId();
    await metaPut('deviceId',dev);
    try{localStorage.setItem(K+'deviceId',dev);}catch(e){}
  }else{try{localStorage.setItem(K+'deviceId',_meta.deviceId);}catch(e){}}
  await queueLoadAll();
  await loadSyncLog();
  let idbT=await kvGet('tombstones');
  let lsT=[];try{lsT=JSON.parse(localStorage.getItem(K+'tombstones')||'[]');}catch(e){}
  const idbRecords=await kvGet('records');
  if(idbRecords===undefined||idbRecords===null){
    tombstones=unionTombstones(idbT||[],lsT||[]);
    await persistLocalInner();
    if(!_meta.migrated_v2&&records&&records.length){
      const now=new Date().toISOString();
      records.forEach(r=>{if(r&&r.date)upsertQueue({store:'records',recordId:r.date,operation:'CREATE',changedAt:r.updated||now,payload:JSON.parse(JSON.stringify(r))});});
      await persistQueueNow();
    }
    await metaPut('migrated_v2',true);
  }else{
    const idbTrash=(await kvGet('trash'))||[];
    const idbSettings=(await kvGet('settings'))||null;
    const idbSeq=(idbSettings&&idbSettings._seq)||0,lsSeq=settings._seq||0;
    if(lsSeq>=idbSeq){
      tombstones=unionTombstones(lsT||[],idbT||[]);
      await persistLocalInner();
    }else{
      records=idbRecords;trash=idbTrash;settings={...settings,...idbSettings};
      tombstones=unionTombstones(idbT||[],lsT||[]);
      try{localStorage.setItem(K+'records',JSON.stringify(records));localStorage.setItem(K+'trash',JSON.stringify(trash));localStorage.setItem(K+'settings',JSON.stringify(settings));localStorage.setItem(K+'tombstones',JSON.stringify(tombstones));}catch(e){}
    }
  }
  if(!settings.settingsUpdatedAt)settings.settingsUpdatedAt=new Date().toISOString();
  _meta.requestsUsed=_meta.requestsUsed||0;_meta.requestsSinceLastReset=_meta.requestsSinceLastReset||0;
  await reconcileQueue();
  const n=pendingCount();_meta.pendingChanges=n;
  if(_meta.lastSyncAt&&!settings.lastSync)settings.lastSync=_meta.lastSyncAt;
  if(settings.lastSync&&!_meta.lastSyncAt)_meta.lastSyncAt=settings.lastSync;
  _syncStatus=!navigator.onLine?'offline':(n>0?'pending':'synced');
  _meta.syncStatus=_syncStatus;
  await persistQueueNow();
  updateSyncUI();
}
async function reconcileQueue(){
  try{
    const h=computeLocalHash();
    if(h===(_meta.lastCloudHash||''))return;
    const keys=new Set((_queue||[]).map(q=>q.recordKey));
    let added=0;const now=new Date().toISOString();
    records.forEach(r=>{if(r&&r.date&&!keys.has('records:'+r.date)){upsertQueue({store:'records',recordId:r.date,operation:'UPDATE',changedAt:r.updated||now,payload:JSON.parse(JSON.stringify(r))});added++;}});
    tombstones.forEach(t=>{const k=t.recordId||t.date;if(k&&!keys.has('records:'+k)){upsertQueue({store:'records',recordId:k,operation:'DELETE',changedAt:t.deletedAt||now,payload:t});added++;}});
    if(added){await persistQueueNow();await addSyncLog('Queue repaired',added+' local change(s) re-queued after restart.');}
  }catch(e){}
}

/* ---------- sync UI ---------- */
function fmtSyncTime(iso){
  if(!iso)return 'Never';
  try{return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return String(iso);}
}
function syncStatusMeta(){
  const n=pendingCount();
  if(!navigator.onLine)return {key:'offline',label:n>0?('\u25cb Offline \u00b7 '+n+' saved'):('\u25cb Offline'),cls:'offline'};
  if(_syncInProgress)return {key:'syncing',label:'\u21bb Syncing\u2026',cls:'syncing'};
  if(_syncStatus==='error')return {key:'error',label:'! Sync failed'+(n>0?(' \u00b7 '+n+' waiting'):''),cls:'error'};
  if(n>0)return {key:'pending',label:'\u2601 '+n+' pending',cls:'pending'};
  return {key:'synced',label:'\u2601 Synced',cls:''};
}
function updateSyncUI(){
  try{
    const m=syncStatusMeta();
    const b=document.getElementById('syncBtn');
    if(b){b.textContent=m.label;b.className='syncbtn '+m.cls;
      b.title='Cloud: '+m.label+' \u00b7 Last Sync: '+fmtSyncTime(_meta.lastSyncAt||settings.lastSync)+' \u00b7 Auto sync: '+autoSyncStatusText()+' \u00b7 Tap for details';}
    const modal=document.getElementById('syncModal');
    if(modal&&modal.classList.contains('show'))renderSyncDetails();
    const cs=document.getElementById('cloudSyncStatus');
    if(cs)cs.innerHTML=syncPanelHtml();
    const cl=document.getElementById('syncLogFull');
    if(cl)cl.textContent=syncLogText();
  }catch(e){}
}
function syncPanelHtml(){
  const m=syncStatusMeta();
  const rl=_meta.lastRateLimit;
  let rate='';
  if(rl&&(rl.remaining!==null&&rl.remaining!==undefined)){
    rate='<div>JSONBin reports: <b>'+rl.remaining+'</b> of '+(rl.limit||'?')+' requests remaining</div>';
    if(rl.remaining!==null&&rl.remaining<=100)rate+='<div>\u26a0 Free allowance nearly exhausted \u2014 sync sparingly.</div>';
  }else{
    rate='<div>Cloud Requests Used (this device): <b>'+(_meta.requestsUsed||0)+'</b></div>';
  }
  const conf=Array.isArray(_meta.conflicts)?_meta.conflicts:[];
  return '<div class="syncmeta">'
    +'<div>Status: <b>'+esc(m.label)+'</b></div>'
    +'<div>Last Sync: <b>'+esc(fmtSyncTime(_meta.lastSyncAt||settings.lastSync))+'</b></div>'
    +'<div>Pending Changes: <b>'+pendingCount()+'</b></div>'
    +'<div>Auto sync: <b>'+esc(autoSyncStatusText())+'</b> <span class="small">(max '+SYNC_CONFIG.AUTO_SYNC_MAX_PER_DAY+'/day)</span></div>'
    +((pendingCount()>0&&syncDayUsedToday())?'<div>\u26a0 Today\u2019s automatic sync is already used \u2014 tap <b>Sync Now</b> to send '+pendingCount()+' change(s) now.</div>':'')
    +'<div>This device: <span class="small">'+esc(_meta.deviceId||'\u2014')+'</span></div>'
    +rate
    +(conf.length?'<div>Conflicts (newest kept): '+esc(conf.slice(0,5).map(c=>c.recordId).join(', '))+(conf.length>5?'\u2026':'')+'</div>':'')
    +'</div>';
}
function syncLogText(){
  if(!_syncLog.length)return 'No sync activity yet.';
  return _syncLog.slice(0,12).map(e=>fmtSyncTime(e.at)+' \u2014 '+e.event+(e.detail?(' \u00b7 '+e.detail):'')).join('\n');
}
function renderSyncDetails(){
  const m=syncStatusMeta();
  document.getElementById('syncDetails').innerHTML='<div class="syncmeta">'
    +'<div>Status: <b>'+esc(m.label)+'</b></div>'
    +'<div>Last Sync: <b>'+esc(fmtSyncTime(_meta.lastSyncAt||settings.lastSync))+'</b></div>'
    +'<div>Pending Changes: <b>'+pendingCount()+'</b></div>'
    +'<div>Auto sync: <b>'+esc(autoSyncStatusText())+'</b> <span class="small">(max '+SYNC_CONFIG.AUTO_SYNC_MAX_PER_DAY+'/day)</span></div>'
    +((pendingCount()>0&&syncDayUsedToday())?'<div>\u26a0 Today\u2019s automatic sync is already used \u2014 tap <b>Sync Now</b> to send '+pendingCount()+' change(s) now.</div>':'')
    +'<div>Cloud Requests Used (this device): <b>'+(_meta.requestsUsed||0)+'</b></div>'
    +'</div>';
  document.getElementById('syncLogMini').textContent=_syncLog.slice(0,8).map(e=>fmtSyncTime(e.at)+' \u2014 '+e.event+(e.detail?(' \u00b7 '+e.detail):'')).join('\n')||'No sync activity yet.';
  const sb=document.getElementById('syncNowBtn');
  if(sb)sb.textContent=(_syncStatus==='error')?'Retry Sync':'Sync Now';
}
function refreshAfterSync(){
  try{$('#headerBranch').textContent=settings.branch.toUpperCase();}catch(e){}
  try{renderDashboard();}catch(e){}
  try{
    const active=(document.querySelector('.page.active')||{}).id||'dashboard';
    if(active==='history')renderHistory();
    else if(active==='reports')renderReports();
    else if(active==='settings')renderSettings();
  }catch(e){}
  updateSyncUI();
}
function wireSyncUI(){
  const b=document.getElementById('syncBtn');
  if(b)b.onclick=()=>{renderSyncDetails();document.getElementById('syncModal').classList.add('show');};
  const c=document.getElementById('closeSync');if(c)c.onclick=()=>document.getElementById('syncModal').classList.remove('show');
  const s=document.getElementById('syncNowBtn');if(s)s.onclick=()=>{document.getElementById('syncModal').classList.remove('show');syncNow('manual').catch(()=>{});};
  const r=document.getElementById('syncRefreshBtn');if(r)r.onclick=()=>{document.getElementById('syncModal').classList.remove('show');syncNow('refresh').catch(()=>{});};
  const e=document.getElementById('syncBackupBtn');if(e)e.onclick=()=>{document.getElementById('syncModal').classList.remove('show');backup();};
}

const JSONBIN_API=SYNC_CONFIG.API_BASE+'/b';
function getJsonbinKey(){return localStorage.getItem(K+'jsonbinKey')||CLOUD_KEY||''}
function setJsonbinKey(v){localStorage.setItem(K+'jsonbinKey',(v||'').trim())}
function getBinId(){return localStorage.getItem(K+'binId')||CLOUD_BIN||settings.binId||''}
function setBinId(v){v=(v||'').trim();localStorage.setItem(K+'binId',v);if(v){settings.binId=v;localStorage.setItem(K+'settings',JSON.stringify(settings))}}
function getSyncCode(){return getBinId()}
function setSyncCode(v){setBinId(v)}
function jsonbinHeaders(){
  const key=getJsonbinKey();
  return {'Content-Type':'application/json','X-Access-Key':key,'X-Bin-Private':'false'};
}
async function pullCloud(){return syncNow('refresh');}
async function pushCloud(){return syncNow('manual');}
async function autoSync(){if(pendingCount()<=0)return {noop:true};return syncNow('auto');}

async function loadPublicView(binId){
  try{
    const r=await fetch(JSONBIN_API+'/'+encodeURIComponent(binId)+'/latest');
    if(!r.ok){toast('Could not load public report');return}
    const j=await r.json();
    const d=j.record||j;
    records=Array.isArray(d.records)?d.records:[];
    trash=[];
    if(d.settings&&typeof d.settings==='object'){
      settings={...settings,...d.settings,pin:'',autoLock:0};
    }
    document.body.classList.add('public-view');
    const ban=document.createElement('div');
    ban.id='publicBanner';
    ban.style.cssText='position:sticky;top:0;z-index:50;background:#06377d;color:#fff;padding:10px 14px;font-size:13px;font-weight:700;text-align:center';
    ban.textContent='Public view — read only · FSIB Branch Marketing Report';
    document.body.insertBefore(ban,document.body.firstChild);
    // hide install, pin-sensitive, settings edit is ok but disable save cloud
    const ib=document.getElementById('installBtn');if(ib)ib.classList.add('hidden');
    renderDashboard();
    // override nav to allow dashboard history reports only
    toast('Public report loaded ('+records.length+' days)');
  }catch(e){console.error(e);toast('Public load failed')}
}
function getViewBinFromUrl(){
  try{return new URLSearchParams(location.search).get('view')||''}catch(e){return ''}
}



function network(){
  let on=navigator.onLine;
  $('#netStatus').textContent=on?'ONLINE':'OFFLINE MODE';
  $('#netStatus').classList.toggle('offline',!on);
  if(!on){if(_syncStatus!=='offline'){_syncStatus='offline';updateSyncUI();}}
  else{if(_syncStatus==='offline'){_syncStatus=pendingCount()>0?'pending':'synced';updateSyncUI();maybeSyncOnReconnect();}}
}
function maybeSyncOnReconnect(){
  if(!settings.autoSync)return;
  try{if(getViewBinFromUrl())return;}catch(e){}
  if(!getJsonbinKey())return;
  if(syncDayUsedToday())return;
  clearTimeout(window._onlineSyncT);
  window._onlineSyncT=setTimeout(()=>{maybeDailyAutoSync('online');},1200);
}
addEventListener('online',network);addEventListener('offline',network);let deferredPrompt=null;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)maybeDailyAutoSync('visible');});
window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredPrompt=event;
  const installButton=document.getElementById("installBtn");
  if(installButton){installButton.classList.remove("hidden");}
});
document.getElementById("installBtn")?.addEventListener("click",async()=>{
  if(!deferredPrompt){return;}
  deferredPrompt.prompt();
  const result=await deferredPrompt.userChoice;
  if(result.outcome==="accepted"){console.log("FSIB Marketing installed");}
  deferredPrompt=null;
  document.getElementById("installBtn")?.classList.add("hidden");
});
window.addEventListener("appinstalled",()=>{
  deferredPrompt=null;
  document.getElementById("installBtn")?.classList.add("hidden");
  console.log("FSIB Marketing app installed successfully");
});
function isInstalledPWA(){
  return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
}
if(isInstalledPWA()){
  document.getElementById("installBtn")?.classList.add("hidden");
}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./service-worker.js",{scope:"./"})
      .then(registration=>{
        console.log("FSIB Marketing PWA registered:",registration.scope);
      })
      .catch(error=>{
        console.error("FSIB Marketing PWA registration failed:",error);
      });
  });
}
theme();network();$('#headerBranch').textContent=settings.branch.toUpperCase();renderDashboard();resetLock();
wireSyncUI();
initLocalDB().then(()=>{
  refreshAfterSync();
  updateSyncUI();
  const vb=getViewBinFromUrl();
  if(vb){loadPublicView(vb);return;}
  if(getJsonbinKey()&&getBinId()&&navigator.onLine&&dailyAutoSyncDue()){setTimeout(()=>{maybeDailyAutoSync('startup');},900);}
}).catch(e=>{console.error('local db init failed',e);updateSyncUI();});
