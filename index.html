<style>

secondary,.danger{border:0;border-radius:10px;padding:12px 14px;font-weight:800;color:#fff;background:var(--blue);min-height:43px}.secondary{background:var(--green)}.danger{background:var(--red)}.outline{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 11px;font-weight:700}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}label{font-weight:700;font-size:12px;color:var(--muted);display:block;margin:0 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);color:var(--ink);font:inherit;min-height:43px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #1264d620}.formgroup{margin-bottom:12px}.section{margin-top:18px;padding-top:2px}.sectiontitle{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}.total{background:var(--soft);border:1px solid #1264d633;border-radius:12px;padding:12px;font-weight:800}.total b{font-size:19px;color:var(--blue)}.repeatrow{display:grid;grid-template-columns:1fr 1fr 42px;gap:7px;margin:7px 0}.visitrow{grid-template-columns:1fr 1fr 1.2fr 1.2fr 1fr 42px}.accountrow{display:grid;grid-template-columns:112px 1fr 1fr 40px;gap:7px;margin:7px 0}.remove{border:0;border-radius:9px;background:#fbe5e8;color:#c43e53;font-size:18px}.dark .remove{background:#2a1115}.add{width:100%;padding:10px;color:var(--blue);font-weight:800;background:var(--soft);border:1px dashed var(--blue);border-radius:10px}.preview{white-space:pre-wrap;line-height:1.65;max-height:300px;overflow:auto;font-family:monospace;background:var(--soft);padding:12px;border-radius:12px;border-left:4px solid var(--blue)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}.nav{position:fixed;z-index:35;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{max-width:720px;display:flex;width:100%}.nav button{flex:1;border:0;background:none;padding:10px 3px 8px;color:var(--muted);font-size:10px}.nav button span{font-size:19px;display:block}.nav button.active{color:var(--blue);font-weight:800}.record{margin-bottom:10px}.recordtop{display:flex;justify-content:space-between;gap:8px;font-weight:800}.record .actions{margin-top:9px}.pill{background:var(--soft);color:var(--blue);padding:4px 7px;border-radius:20px;font-size:11px;font-weight:800}.progress{height:10px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--green)}.barwrap{height:145px;display:flex;gap:7px;align-items:end;border-bottom:1px solid var(--line);padding:0 4px}.bar{background:linear-gradient(#4c97ff,#1264d6);flex:1;min-width:10px;border-radius:5px 5px 0 0;position:relative}.bar em{position:absolute;bottom:-19px;width:100%;font-size:9px;text-align:center;color:var(--muted);font-style:normal}.toast{position:fixed;z-index:70;bottom:92px;left:50%;transform:translateX(-50%);padding:12px 16px;background:#102238;color:#fff;border-radius:10px;box-shadow:0 5px 20px #0004;display:none}.modal{position:fixed;z-index:80;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(420px,100%);background:var(--card);padding:20px;border-radius:16px}.modalbox h3{margin-top:0}.empty{text-align:center;color:var(--muted);padding:28px}.notice{padding:10px;border-radius:10px;background:#fff5d8;color:#755400;font-size:12px;margin-bottom:10px}.hidden{display:none!important}@media(max-width:560px){.visitrow{grid-template-columns:1fr 1fr}.visitrow .remove{grid-column:1/-1;min-height:40px}}@media(min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}.page{padding:20px}.formwide{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.formwide .full{grid-column:1/-1}.nav{top:0;bottom:auto;left:auto;width:240px;border:0;height:100vh;align-items:center}. </style></head><body><main class="app">
<header class="top"><div><div class="bank">FIRST SECURITY ISLAMI BANK PLC</div><div class="branch" id="headerBranch">TANTAR BRANCH</div><div class="reportname">DAILY BRANCH MARKETING REPORT</div></div><div class="head-actions"><span class="status" id="netStatus">ONLINE</span><button id="installBtn" class="hidden">Install</button><button class="theme" id="themeBtn" aria-label="theme">☀️</button></div></header>
<section class="page active" id="dashboard"></section><section class="page" id="entry"></section><section class="page" id="history"></section><section class="page" id="reports"></section><section class="page" id="settings"></section>
</main><nav class="nav"><div class="navinner"><button class="active" data-page="dashboard"><span>⌂</span>Dashboard</button><button data-page="entry"><span>✚</span>Data Entry</button><button data-page="history"><span>◷</span>History</button><button data-page="reports"><span>▥</span>Reports</button><button data-page="settings"><span>⚙</span>Settings</button></div></nav><div class="toast" id="toast"></div>
<div class="modal" id="pinModal"><div class="modalbox"><h3 id="pinTitle">Enter PIN</h3><p class="small" id="pinText">Enter your 4-digit app PIN to continue.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="actions"><button class="primary" id="pinConfirm">Confirm</button></div></div></div><div class="modal" id="reportModal"><div class="modalbox" style="max-height:88vh;overflow:auto"><div class="sectionhead"><h2>WhatsApp Share Preview</h2><button class="outline" id="closeShare">×</button></div><div class="sectiontitle">Current Daily Report</div><div class="preview" id="summaryPreview"></div><div class="actions"><button class="outline" id="copySummary">Copy Summary</button><button class="secondary" id="sendSummary">Send Summary</button></div><div class="sectiontitle" style="margin-top:18px">Detailed Daily Activity</div><div class="preview" id="detailPreview"></div><div class="actions"><button class="outline" id="copyDetail">Copy Details</button><button class="secondary" id="sendDetail">Send Details</button></div></div></div>
<script>
const K='bmr_v1_', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let settings=JSON.parse(localStorage.getItem(K+'settings')||'null')||{branch:'Tantar Branch',zone:'Cumilla',team:'Team-8',totalBranch:21,target:0,theme:'system',weeklyStart:0,weeklyEnd:4,manager:'Harun Or Rashid',managerDesignation:'Manager',template:'Attn : Head of Treasury.\n\nDaily Report Date : {{date}}\n\n{{team}} ({{zone}} Zone)\n\nTotal Branch: {{branches}}\nReported Branch: {{branch}}\n\nTotal Places Visited: {{visits}}\n\nTotal Deposit: Tk {{deposit}}\n\nRegd.\n\n{{manager}}\n{{managerDesignation}}\n{{branch}}',pin:'',autoLock:0,lastBackup:''};
const legacyTemplate='Attn : Head of Treasury.\n\nDaily Report Date : {{date}}\n\n{{team}} ({{zone}} Zone)\n\nTotal Branch: {{branches}}\n\nTotal Places Visited: {{visits}}\n\nTotal Deposit: Tk {{deposit}}\n\n{{officers}}';
const treasuryTemplate='Attn : Head of Treasury.\n\nDaily Report Date : {{date}}\n\n{{team}} ({{zone}} Zone)\n\nTotal Branch: {{branches}}\nReported Branch: {{branch}}\n\nTotal Places Visited: {{visits}}\n\nTotal Deposit: Tk {{deposit}}\n\nRegd.\n\n{{manager}}\n{{managerDesignation}}\n{{branch}}';
if(settings.template===legacyTemplate) settings.template=treasuryTemplate;
settings.manager=settings.manager||'Harun Or Rashid'; settings.managerDesignation=settings.managerDesignation||'Manager';
let records=JSON.parse(localStorage.getItem(K+'records')||'[]'), trash=JSON.parse(localStorage.getItem(K+'trash')||'[]'), deferred, locked=false, activity;
const officers={'Harun Or Rashid':'Assistant Vice President','Mohammad Showkat Hossain':'Principle Officer','Md. Mazharul Islam':'Principle Officer (Cash)','Md. Fazlul Karim':'Senior Officer','Mohammed Mominul Hoque':'Officer','Kamruzzaman Shakil':'Officer (Cash)','Mohammad Mijanur Rahman':'Junior Officer','Al-Amin Hafiz Ibne Akhter':'Junior Officer','Md. Jashim Uddin':'Junior Officer','Md. Hanifur Alam':'Junior Officer','Rafiq Uddin':'Junior Officer (Cash)','Md. Arafat':'Assistant Officer (Cash)'};
function save(){localStorage.setItem(K+'records',JSON.stringify(records));localStorage.setItem(K+'trash',JSON.stringify(trash));localStorage.setItem(K+'settings',JSON.stringify(settings))}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function num(v){return Number(String(v??'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/,/g,''))||0}function money(n){return num(n).toLocaleString('en-IN',{maximumFractionDigits:2})}function lac(n){return (num(n)/100000).toFixed(2)+' Lac'}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2800)}function dateText(d){return new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}function total(r){return ['cash','clearing','rtgs','npsb','agent'].reduce((a,k)=>a+num(r[k]),0)}function accountsTotal(r){return (r.accounts||[]).reduce((a,x)=>a+num(x.amount),0)}function accountsCount(r){return (r.accounts||[]).filter(x=>x.no).length}function visits(r){return num(r.places)||((r.visits||[]).length)}
function theme(){let dark=settings.theme==='dark'||(settings.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',dark);$('#themeBtn').textContent=dark?'🌙':'☀️'}function setTheme(){settings.theme=document.body.classList.contains('dark')?'light':'dark';save();theme()}$('#themeBtn').onclick=setTheme;
function nav(page){if(page==='entry') renderEntry();if(page==='history')renderHistory();if(page==='reports')renderReports();if(page==='settings')renderSettings();if(page==='dashboard')renderDashboard();$$('.page').forEach(x=>x.classList.toggle('active',x.id===page));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page))}$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function renderDashboard(){let t=today(), now=records.find(r=>r.date===t), start=new Date();start.setDate(start.getDate()-6);let week=records.filter(r=>new Date(r.date+'T12:00')>=start), month=records.filter(r=>r.date.slice(0,7)===t.slice(0,7)), sum=a=>a.reduce((x,r)=>x+total(r),0), best=[...records].sort((a,b)=>total(b)-total(a))[0], bestV=[...records].sort((a,b)=>visits(b)-visits(a))[0];let officerScores={};records.forEach(r=>(r.officers||[]).forEach(o=>officerScores[o.name]=(officerScores[o.name]||0)+total(r)));let bestO=Object.entries(officerScores).sort((a,b)=>b[1]-a[1])[0];$('#dashboard').innerHTML=`<div class="sectionhead"><div><h2>Dashboard</h2><span class="small">${esc(settings.branch)} · ${esc(settings.zone)}</span></div><span class="small">${dateText(t)}</span></div><div class="grid metrics"><div class="card metric accent"><label>Today’s Deposit</label><strong>৳ ${money(now?total(now):0)}</strong><small>${lac(now?total(now):0)}</small></div><div class="card metric green"><label>Today’s Visits</label><strong>${now?visits(now):0}</strong></div><div class="card metric"><label>Weekly Deposit</label><strong>৳ ${money(sum(week))}</strong></div><div class="card metric"><label>Monthly Deposit</label><strong>৳ ${money(sum(month))}</strong></div><div class="card metric"><label>New Accounts</label><strong>${now?accountsCount(now):0}</strong></div><div class="card metric"><label>Account Deposit</label><strong>৳ ${money(now?accountsTotal(now):0)}</strong></div></div>`}
function officerOpts(v=''){return `<option value="">Select officer</option>`+Object.keys(officers).map(n=>`<option ${n===v?'selected':''}>${n}</option>`).join('')}function officerRow(o={}){return `<div class="repeatrow officer"><select class="oname">${officerOpts(o.name)}</select><input class="odes" readonly placeholder="Designation" value="${esc(o.designation||officers[o.name]||'')}"><button class="remove" type="button">×</button></div>`}function visitRow(v={}){return `<div class="visit repeatrow visitrow"><select class="vofficer">${officerOpts(v.officer||'')}</select><select class="vtype">${['Organization','School','College','Mosque','Madrasa','NGO','Business','Customer','Other'].map(x=>`<option ${x===v.type?'selected':''}>${x}</option>`).join('')}</select><input class="vname" placeholder="Place / institution" value="${esc(v.name||'')}"><input class="vaddress" placeholder="Address" value="${esc(v.address||'')}"><input class="vmobile" inputmode="tel" placeholder="Mobile number" value="${esc(v.mobile||'')}"><button class="remove" type="button">×</button></div>`}function accountRow(a={}){return `<div class="accountrow account"><select class="acat">${['Savings','Current','MTDR','DPS / Other'].map(x=>`<option ${x===a.category?'selected':''}>${x}</option>`).join('')}</select><input class="ano" placeholder="Account number" value="${esc(a.no||'')}"><input class="aamount amount" inputmode="decimal" placeholder="Amount (৳)" value="${esc(a.amount||'')}"><button class="remove" type="button">×</button></div>`}
function renderEntry(record){record=record||JSON.parse(localStorage.getItem(K+'draft')||'null')||{date:today(),officers:[],visits:[],accounts:[]};$('#entry').innerHTML=`<div class="sectionhead"><h2>Daily Data Entry</h2><span class="small" id="draftStatus">Draft ready</span></div><div class="notice">Draft is saved automatically. Tap <b>Save Daily Data</b> to finalize the report.</div><form id="form"><div class="formwide"><div class="formgroup"><label>Date</label><input id="date" type="date" max="${today()}" value="${record.date||today()}"></div><div class="formgroup"><label>Total Places Visited</label><input id="places" class="amount" inputmode="numeric" value="${record.places||''}" placeholder="0"></div><div class="formgroup"><label>Branch</label><input value="${esc(settings.branch)}" readonly></div><div class="formgroup"><label>Zone · Team · Total Branch</label><input value="${esc(settings.zone)} · ${esc(settings.team)} · ${settings.totalBranch}" readonly></div></div><div class="section"><div class="sectiontitle">Officers</div><div id="officers">${(record.officers||[]).map(officerRow).join('')}</div><button class="add" type="button" id="addOfficer">+ Add officer</button></div><div class="section"><div class="sectiontitle">Visit Details</div><div id="visits">${(record.visits||[]).map(visitRow).join('')}</div><button class="add" type="button" id="addVisit">+ Add visit</button></div><div class="section"><div class="sectiontitle">Deposit Entry</div><div class="formwide">${[['cash','Cash'],['clearing','Clearing / BFTN'],['rtgs','RTGS'],['npsb','NPSB'],['agent','Agent Outlet Deposit']].map(([id,l])=>`<div class="formgroup"><label>${l} (৳)</label><input id="${id}" class="amount" inputmode="decimal" value="${record[id]||''}" placeholder="0"></div>`).join('')}<div class="total full">Total Deposit: <b id="depTotal">৳ 0</b> <span class="small" id="depLac"></span></div></div></div><div class="section"><div class="sectiontitle">New Accounts</div><div id="accounts">${(record.accounts||[]).map(accountRow).join('')}</div><button class="add" type="button" id="addAccount">+ Add account</button><div class="total" style="margin-top:9px">Accounts: <b id="acCount">0</b> · Account Deposit: <b id="acTotal">৳ 0</b></div></div><div id="sharePanel"></div><button class="primary" style="width:100%;margin-top:18px" type="submit">Save Daily Data</button></form>`;bindEntry();calcEntry()}
function currentForm(){let f=$('#form');return {date:$('#date').value,places:$('#places').value, cash:$('#cash').value,clearing:$('#clearing').value,rtgs:$('#rtgs').value,npsb:$('#npsb').value,agent:$('#agent').value,officers:$$('.officer').map(x=>({name:x.querySelector('.oname').value,designation:x.querySelector('.odes').value})).filter(x=>x.name),visits:$$('.visit').map(x=>({officer:x.querySelector('.vofficer').value,type:x.querySelector('.vtype').value,name:x.querySelector('.vname').value,address:x.querySelector('.vaddress').value,mobile:x.querySelector('.vmobile').value})).filter(x=>x.name||x.address||x.mobile),accounts:$$('.account').map(x=>({category:x.querySelector('.acat').value,no:x.querySelector('.ano').value.trim(),amount:x.querySelector('.aamount').value})).filter(x=>x.no||x.amount),updated:new Date().toISOString()}}
function message(r){
  let os=(r.officers||[]).map((o,i)=>`${i+1}. ${o.name}, ${o.designation}`).join('\n')||'No officer entered';
  // replaceAll is important: {{branch}} appears both in the report heading and beneath the manager signature.
  const values={date:dateText(r.date),team:settings.team,zone:settings.zone,branches:settings.totalBranch,branch:settings.branch,visits:visits(r),deposit:money(total(r)),manager:settings.manager||'Harun Or Rashid',managerDesignation:settings.managerDesignation||'Manager',officers:os};
  let text=settings.template||treasuryTemplate;
  Object.entries(values).forEach(([key,value])=>text=text.split('{{'+key+'}}').join(String(value)));
  // Keeps older, manually customized templates in sync too.
  return text.split('Tantar Branch').join(settings.branch);
}function detailedMessage(r){
  const deposit=[['Cash',r.cash],['Clearing / BFTN',r.clearing],['RTGS',r.rtgs],['NPSB',r.npsb],['Agent Outlet Deposit',r.agent]].filter(x=>num(x[1])>0).map(x=>`${x[0]}: Tk ${money(x[1])}`).join('\n')||'No deposit entry';
  const officerList=(r.officers||[]).map((o,i)=>`${i+1}. ${o.name}, ${o.designation}`).join('\n')||'No officer entry';
  const visitList=(r.visits||[]).map((v,i)=>`${i+1}. ${v.officer||'Officer not selected'} | ${v.type}: ${v.name||'—'} | ${v.address||'—'} | ${v.mobile||'—'}`).join('\n')||'No visit detail';
  const accountList=(r.accounts||[]).filter(a=>a.no).map(a=>`${a.category}: ${a.no} — Tk ${money(a.amount)}`).join('\n')||'No account entry';
  return `*DAILY BRANCH ACTIVITY DETAILS*\n\nDate: ${dateText(r.date)}\nBranch: ${settings.branch}\nZone: ${settings.zone}\n\n*TOTAL PLACES VISITED:* ${visits(r)}\n\n*OFFICERS*\n${officerList}\n\n*VISIT DETAILS*\n${visitList}\n\n*DEPOSIT DETAILS*\n${deposit}\n\n*TOTAL DEPOSIT:* Tk ${money(total(r))}\n\n*NEW ACCOUNTS*\n${accountList}\n\n*ACCOUNT DEPOSIT:* Tk ${money(accountsTotal(r))}`;
}
function hasEntryData(r){return num(r.places)>0||total(r)>0||(r.officers||[]).length>0||(r.visits||[]).length>0||(r.accounts||[]).length>0}
function openShareModal(record){
  if(!record||!hasEntryData(record))return toast('শেয়ার করার জন্য কোনো saved data নেই।');
  const summary=message(record), details=detailedMessage(record), modal=$('#reportModal');
  $('#summaryPreview').textContent=summary;$('#detailPreview').textContent=details;modal.classList.add('show');
  $('#closeShare').onclick=()=>modal.classList.remove('show');
  $('#copySummary').onclick=()=>{navigator.clipboard?.writeText(summary);toast('Summary copied')};
  $('#sendSummary').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(summary),'_blank');
  $('#copyDetail').onclick=()=>{navigator.clipboard?.writeText(details);toast('Detailed activity copied')};

le="text-align:center">Restore Backup<input id="restore" type="file" accept="application/json" hidden></label><button class="outline" id="trashBtn">Recently Deleted (${tr})</button></div><div class="actions"><button class="danger" id="clear">Clear All Data</button></div></div><div class="sectionhead"><h2>WhatsApp Template</h2></div><div class="card"><textarea id="sTemplate" rows="9">${esc(settings.template)}</textarea><p class="small">Use: {{date}}, {{team}}, {{zone}}, {{branches}}, {{branch}}, {{visits}}, {{deposit}}, {{manager}}, {{managerDesignation}}, {{officers}}</p></div>`;$('#saveSettings').onclick=applySettings;function applySettings(){settings.branch=$('#sBranch').value.trim()||'Tantar Branch';settings.zone=$('#sZone').value.trim()||'Cumilla';settings.team=$('#sTeam').value.trim()||'Team-8';settings.totalBranch=num($('#sBranches').value)||21;settings.manager=$('#sManager').value.trim()||'Harun Or Rashid';settings.managerDesignation=$('#sManagerDesignation').value.trim()||'Manager';settings.target=num($('#sTarget').value);settings.autoLock=num($('#sLock').value);settings.template=$('#sTemplate').value||treasuryTemplate;save();$('#headerBranch').textContent=settings.branch.toUpperCase();renderDashboard();toast('Settings saved — branch name updated everywhere.')};$('#setPin').onclick=()=>setPin();if($('#removePin'))$('#removePin').onclick=()=>protectedAction(()=>{settings.pin='';save();toast('PIN disabled');renderSettings()});if($('#lockNow'))$('#lockNow').onclick=lock;$('#backup').onclick=backup;$('#restore').onchange=restore;$('#trashBtn').onclick=showTrash;$('#clear').onclick=()=>protectedAction(()=>{if(confirm('Permanently clear all active records?')){records=[];save();renderSettings();renderDashboard();toast('Data cleared')}})}
function backup(){let data={app:'Branch Marketing Report',created:new Date().toISOString(),records,trash,settings};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='BranchMarketingReport_Backup_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';a.click();settings.lastBackup=new Date().toLocaleDateString();save();toast('Backup downloaded')}
function restore(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.records))throw 0;let overlap=d.records.filter(x=>records.some(r=>r.date===x.date)).length;if(!confirm(`Backup has ${d.records.length} records (${overlap} duplicate dates). OK = Merge, Cancel = stop.`))return;d.records.forEach(x=>{let i=records.findIndex(r=>r.date===x.date);if(i<0)records.push(x)});save();toast('Backup merged successfully');renderSettings();renderDashboard()}catch{toast('Invalid backup file')}};rd.readAsText(f)}
function showTrash(){let text=trash.map(r=>`${r.date} · ৳ ${money(total(r))}`).join('\n')||'Trash is empty.';if(!trash.length)return alert(text);let d=prompt(text+'\n\nEnter a date (YYYY-MM-DD) to restore, or Cancel.');if(d){let i=trash.findIndex(r=>r.date===d);if(i<0)return toast('Date not found');let r=trash.splice(i,1)[0];delete r.deleted;records=records.filter(x=>x.date!==r.date);records.push(r);save();toast('Record restored');renderSettings()}}
function protectedAction(fn){if(!settings.pin)return fn();askPin(fn)}function setPin(){let a=prompt('Set a 4-digit PIN');if(!/^\d{4}$/.test(a||''))return toast('PIN must be exactly 4 digits');let b=prompt('Confirm PIN');if(a!==b)return toast('PIN did not match');settings.pin=a;save();toast('PIN enabled');renderSettings()}function askPin(ok){$('#pinModal').classList.add('show');$('#pinInput').value='';$('#pinConfirm').onclick=()=>{if($('#pinInput').value===settings.pin){$('#pinModal').classList.remove('show');ok()}else toast('Incorrect PIN')}}function lock(){if(!settings.pin)return;locked=true;$('#pinTitle').textContent='App Locked';$('#pinModal').classList.add('show');$('#pinInput').value='';$('#pinConfirm').onclick=()=>{if($('#pinInput').value===settings.pin){locked=false;$('#pinModal').classList.remove('show');resetLock()}else toast('Incorrect PIN')}}function resetLock(){clearTimeout(activity);if(settings.pin&&num(settings.autoLock)>0)activity=setTimeout(lock,num(settings.autoLock)*60000)}document.addEventListener('click',resetLock);document.addEventListener('input',resetLock);
function network(){let on=navigator.onLine;$('#netStatus').textContent=on?'ONLINE':'OFFLINE MODE';$('#netStatus').classList.toggle('offline',!on)}addEventListener('online',network);addEventListener('offline',network);addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('#installBtn').classList.add('hidden')}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));theme();network();$('#headerBranch').textContent=settings.branch.toUpperCase();renderDashboard();resetLock();
