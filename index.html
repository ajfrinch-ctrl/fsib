<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1264d6">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FSIB Marketing">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>FSIB Branch Marketing Report</title>
<style>
/* ================= FSIB Branch Marketing Report — mobile-first UI =================
   Base rules target phones (320px+); the min-width:700px block restores the
   tablet/desktop sidebar layout. Touch targets are >= 44px, form fields are 16px
   (prevents iOS auto-zoom) and every row degrades to a labelled card on phones. */
:root{
  --bg:#f3f7fc;--card:#fff;--ink:#14233b;--muted:#66778f;--line:#dce5f0;--blue:#1264d6;--blue2:#0a479d;
  --soft:#eaf3ff;--green:#0b9562;--red:#d9465f;--shadow:0 9px 28px #1d4c8a16;
  --nav-h:58px;--tap:44px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  padding-bottom:calc(var(--nav-h) + var(--sab) + 16px);
  /* clip (not hidden) keeps the sticky header working while still blocking sideways scroll */
  overflow-x:clip;-webkit-tap-highlight-color:transparent;
}
body.dark{--bg:#000;--card:#000;--ink:#f5f5f5;--muted:#aaa;--line:#303030;--blue:#468fff;--soft:#101010;--shadow:none}
body.modal-open{overflow:hidden}
button,a,input,select,textarea,label.outline{touch-action:manipulation}
.app{max-width:1040px;margin:auto;padding-left:var(--sal);padding-right:var(--sar)}

/* ---------------- header ---------------- */
.top{position:sticky;z-index:30;top:0;color:#fff;background:linear-gradient(125deg,#06377d,#1264d6);
  padding:calc(12px + var(--sat)) 14px 12px;display:flex;flex-wrap:wrap;align-items:center;
  justify-content:space-between;gap:8px 10px;box-shadow:0 4px 12px #0003;
  border-bottom:3px solid transparent}
/* Online and caught up: the top bar itself is the status, not a button. */
.top.online-synced{border-bottom-color:#3ee08a}
.top>div:first-child{min-width:0;flex:1 1 100%}
.dark .top{background:linear-gradient(125deg,#000,#061d43)}
.reportname{font-size:15px;font-weight:800;letter-spacing:.4px;color:#fff;overflow-wrap:anywhere}
.head-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;width:100%;justify-content:flex-end}
.iconbtn,.top button{border:1px solid #ffffff55;background:#ffffff1d;color:#fff;border-radius:10px;
  min-width:var(--tap);min-height:var(--tap);font:inherit;font-weight:800;cursor:pointer;padding:0 12px;
  display:inline-flex;align-items:center;justify-content:center}
.theme{font-size:19px}
.status{font-size:10px;background:#ffffff22;border-radius:20px;padding:6px 9px;font-weight:700;white-space:nowrap}
.offline{background:#a6404e!important}

/* ---------------- pages, cards, metrics ---------------- */
.page{padding:12px 10px;display:none}
.page.active{display:block}
.grid{display:grid;gap:10px}
.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow);min-width:0}
.metric label,.label{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.metric strong{font-size:18px;display:block;margin-top:7px;line-height:1.25;overflow-wrap:anywhere}
.metric small{overflow-wrap:anywhere}
.accent{border-left:4px solid var(--blue)}
.green{border-left-color:var(--green)}
.sectionhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin:18px 2px 9px}
.sectionhead h2{margin:0;font-size:17px;min-width:0;overflow-wrap:anywhere}
.small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* ---------------- buttons ---------------- */
button{cursor:pointer;font:inherit}
.primary,.secondary,.danger{border:0;border-radius:10px;padding:13px 14px;font-weight:800;color:#fff;background:var(--blue);
  min-height:48px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.secondary{background:var(--green)}
.danger{background:var(--red)}
.card>.primary,.card>.secondary{width:100%}
.primary:active,.secondary:active,.danger:active,.outline:active,.add:active,.nav button:active{filter:brightness(.92)}
.outline{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:12px 14px;
  font-weight:700;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;text-align:center}
label.outline{cursor:pointer}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}

/* ---------------- forms ---------------- */
label{font-weight:700;font-size:12px;color:var(--muted);display:block;margin:0 0 5px}
input,select,textarea{width:100%;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;
  background:var(--card);color:var(--ink);font:inherit;font-size:16px;min-height:46px}
input[type=checkbox]{width:auto;min-height:auto;padding:0;margin:0;flex:0 0 auto}
input[readonly]{background:var(--soft);color:var(--muted)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #1264d633}
input[type=date],input[type=month]{min-height:46px}
.formgroup{margin-bottom:12px;min-width:0}
.section{margin-top:18px;padding-top:2px}
.sectiontitle{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px}
.total{background:var(--soft);border:1px solid #1264d633;border-radius:12px;padding:12px;font-weight:800;overflow-wrap:anywhere}
.total b{font-size:18px;color:var(--blue);overflow-wrap:anywhere}


/* ---------------- restructured daily entry ---------------- */
.entry-intro{margin:0 0 14px;background:linear-gradient(135deg,var(--soft),var(--card));border:1px solid #1264d633;border-radius:16px;padding:15px}
.entry-intro h2{margin:0 0 4px;font-size:20px}.entry-intro .small{display:block}
.entry-section{margin:14px 0;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.entry-section .sectiontitle{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px}.entry-section .sectiontitle::before{content:attr(data-step);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px}
.entry-date{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.entry-date .formgroup{margin:0}
.deposit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.deposit-grid .formgroup{margin:0}.deposit-grid .total{grid-column:1/-1;margin-top:4px}
.account-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.account-summary .total{margin:0}
.entry-section .add{margin-top:2px}
@media(min-width:700px){.entry-date{grid-template-columns:minmax(220px,360px) minmax(140px,220px)}.deposit-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.deposit-grid .total{grid-column:1/-1}.account-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------------- repeating rows (officer / visit / account) ---------------- */
.repeatrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;align-items:start}
.visitrow{grid-template-columns:1fr 1fr}
.accountrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;align-items:start}
.repeatrow,.accountrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.cell{min-width:0;display:flex;flex-direction:column}
.rl{display:block;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.c-name,.c-address{grid-column:1/-1}
.accountrow .remove,.officer .remove{grid-column:1/-1}
.remove{border:0;border-radius:9px;background:#fbe5e8;color:#c43e53;font-size:20px;line-height:1;
  min-height:var(--tap);min-width:var(--tap)}
.dark .remove{background:#2a1115}
.add{width:100%;padding:13px 10px;color:var(--blue);font-weight:800;background:var(--soft);border:1px dashed var(--blue);
  border-radius:10px;min-height:48px}

/* the entry form's main save button stays reachable while scrolling on phones */
#form>.primary[type=submit]{position:sticky;bottom:calc(var(--nav-h) + var(--sab) + 10px);z-index:20;
  margin-top:18px;margin-bottom:8px;box-shadow:0 -8px 22px #1d4c8a2e}

/* ---------------- previews, lists ---------------- */
.preview{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:min(45vh,300px);overflow:auto;
  -webkit-overflow-scrolling:touch;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  background:var(--soft);padding:12px;border-radius:12px;border-left:4px solid var(--blue)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions>*{flex:1 1 140px;min-width:0}
.record{margin-bottom:10px}
.recordtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-weight:800}
.record .actions{margin-top:9px}
.pill{background:var(--soft);color:var(--blue);padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.progress{height:10px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:9px}
.progress i{display:block;height:100%;background:var(--green)}
.barwrap{height:145px;display:flex;gap:7px;align-items:end;border-bottom:1px solid var(--line);padding:0 4px}
.bar{background:linear-gradient(#4c97ff,#1264d6);flex:1;min-width:10px;border-radius:5px 5px 0 0;position:relative}
.bar em{position:absolute;bottom:-19px;width:100%;font-size:9px;text-align:center;color:var(--muted);font-style:normal}

/* ---------------- dashboard (hero, 7-day trend, target, highlights) ---------------- */
.dash-hero{border-radius:18px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#06377d,#1264d6 60%,#3f8bff);box-shadow:0 12px 30px #0a479d33;margin-bottom:10px}
.dash-hero::after{content:"";position:absolute;right:-34px;top:-46px;width:150px;height:150px;border-radius:50%;background:#ffffff14}
.dash-hero.todo{background:linear-gradient(135deg,#31456b,#5a7bb8 60%,#86a8de)}
.dark .dash-hero{background:linear-gradient(135deg,#000,#061d43 65%,#0a3a7a)}
.dark .dash-hero.todo{background:linear-gradient(135deg,#10141f,#28344e 65%,#3a5a8c)}
.dh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.dh-eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
.dh-pill{background:#ffffff26;border:1px solid #ffffff40;border-radius:20px;padding:5px 10px;font-size:10px;font-weight:800;white-space:nowrap}
.dh-amount{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:10px;position:relative;z-index:1;overflow-wrap:anywhere}
.dh-sub{font-size:12.5px;opacity:.92;margin-top:5px;position:relative;z-index:1;overflow-wrap:anywhere}
.dh-cta{margin-top:14px;width:100%;min-height:var(--tap);border:0;border-radius:12px;background:#fff;color:#0a479d;
  font-weight:800;font-size:14px;padding:12px;position:relative;z-index:1}
.dark .dh-cta{background:#1264d6;color:#fff}
.dash-row{display:grid;gap:10px;margin-bottom:10px}
.dh-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh-row .sectiontitle{margin:0}
.tbars{display:flex;gap:7px;align-items:end;height:112px;margin-top:12px;border-bottom:2px solid var(--line);padding:0 2px}
.tbar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tbar i{display:block;width:100%;max-width:36px;min-height:4px;border-radius:6px 6px 0 0;background:linear-gradient(#7fb2ff,#1264d6)}
.dark .tbar i{background:linear-gradient(#2c66c4,#468fff)}
.tbar.now i{background:linear-gradient(#38c48a,#0b9562)}
.dark .tbar.now i{background:linear-gradient(#0f7a52,#31c48a)}
.tbar em{font-style:normal;font-size:10px;font-weight:700;color:var(--muted);margin-top:5px}
.tbar.now em{color:var(--green)}
.dash-goal .dh-goalnum{font-size:22px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}
.dash-goal .progress i{background:linear-gradient(90deg,#3f8bff,#1264d6)}
/* Period summary: one row per period, an accounts cell and a deposit cell —
   today / this week / this month / last 30 days. */
.dash-periods{margin-top:10px;padding:14px 14px 10px}
.ptable{margin-top:10px}
.prow{display:grid;grid-template-columns:minmax(96px,1.15fr) minmax(58px,.7fr) minmax(0,1.35fr);
  gap:8px;align-items:baseline;padding:11px 8px;border-radius:12px}
.prow+.prow{border-top:1px dashed var(--line)}
.prow.phead{padding:0 8px 6px;border:0}
.prow.phead span{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.prow.pnow{background:linear-gradient(90deg,#1264d614,#1264d600);border-top:0}
.dark .prow.pnow{background:linear-gradient(90deg,#3f8bff1f,#3f8bff00)}
.pname{display:flex;flex-direction:column;gap:1px;min-width:0}
.pname b{font-size:13.5px;font-weight:800;overflow-wrap:anywhere}
.pname em{font-style:normal;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.pacct{font-size:19px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pdep{font-size:15.5px;font-weight:800;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pdep small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.prow .pacct.hi{color:var(--green)}
.pnote{margin:8px 2px 2px;font-size:11px;color:var(--muted)}
#dashboard .metric{position:relative;border-radius:16px;padding:14px}
#dashboard .metric strong{font-size:20px;margin-top:6px}
#dashboard .metric small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.dash-hi{margin-top:10px}
.hirow{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.hirow:last-child{border-bottom:0;padding-bottom:2px}
.hilabel{flex:1 1 90px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.hirow b{font-size:15px;overflow-wrap:anywhere}
@media(min-width:700px){
  .dash-row{grid-template-columns:1.35fr 1fr}
  #dashboard .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dh-amount{font-size:40px}
  .prow{grid-template-columns:minmax(150px,1.2fr) minmax(90px,.6fr) minmax(0,1.2fr)}
  .pacct{font-size:21px}
  .pdep{font-size:17px}
}

/* ---------------- bottom navigation ---------------- */
.nav{position:fixed;z-index:35;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:var(--sab);box-shadow:0 -4px 16px #1d4c8a12}
.navinner{max-width:720px;display:flex;width:100%}
.nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:7px 2px 6px;color:var(--muted);font-size:10px;
  min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button span{font-size:19px;display:block;line-height:1}
.nav button b{font-weight:inherit;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.active{color:var(--blue);font-weight:800;box-shadow:inset 0 3px 0 var(--blue)}

/* ---------------- toast & modals ---------------- */
.toast{position:fixed;z-index:100;bottom:calc(var(--nav-h) + var(--sab) + 14px);left:50%;transform:translateX(-50%);
  padding:13px 18px;background:#102238;color:#fff;border-radius:12px;box-shadow:0 5px 20px #0004;display:none;
  max-width:min(92vw,420px);text-align:center;overflow-wrap:anywhere}
.modal{position:fixed;z-index:80;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.show{display:flex}
.modalbox{width:100%;max-width:100%;background:var(--card);padding:16px 14px calc(18px + var(--sab));
  border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  box-shadow:0 -8px 30px #0004}
.modalbox h3{margin-top:0}
.modal-scroll{max-height:92dvh;overflow:auto}
/* ---------------- reports (view tabs, period bar, statement hero, breakdown) ---------------- */
.rep-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.rep-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;min-height:var(--tap);font-size:12.5px;font-weight:800;padding:8px 6px}
.rep-tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px #1264d640}
.dark .rep-tabs button.on{background:#1264d6;color:#fff}
.rep-seg{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:8px}
.rep-seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;min-height:40px;font-size:12.5px;font-weight:800;color:var(--muted);padding:0 4px}
.rep-seg button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.rep-bar{display:flex;align-items:stretch;gap:8px;margin-bottom:12px}
.rep-nav{flex:0 0 46px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;font-weight:800;color:var(--blue);min-height:46px}
.rep-nav:disabled{opacity:.35}
.rep-date{flex:1;margin:0;min-width:0}
.rep-hero{border-radius:18px;padding:18px 16px 16px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0b1f3f,#163a73 55%,#2b63c9);box-shadow:0 12px 30px #0b1f3f33;margin-bottom:12px}
.rep-hero::after{content:"";position:absolute;right:-40px;bottom:-56px;width:160px;height:160px;border-radius:50%;background:#ffffff12}
.dark .rep-hero{background:linear-gradient(135deg,#000,#0a1830 60%,#14315f)}
.rh-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;position:relative;z-index:1}
.rh-period{font-size:15px;font-weight:800;margin-top:2px;position:relative;z-index:1;overflow-wrap:anywhere}
.rh-amount{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1;margin-top:12px;position:relative;z-index:1;overflow-wrap:anywhere}
.rh-sub{font-size:12.5px;opacity:.92;margin-top:5px;position:relative;z-index:1;overflow-wrap:anywhere}
.rh-progwrap{margin-top:12px;position:relative;z-index:1}
.rh-prog{height:10px;border-radius:6px;background:#ffffff2e;overflow:hidden}
.rh-prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8fd0ff,#4be08a)}
.rep-metrics{margin-bottom:2px}
.deprow{padding:9px 0}
.deprow:first-child{padding-top:2px}
.deprow:last-child{padding-bottom:2px}
.deprow .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;margin-bottom:6px}
.deprow .lbl span{font-weight:800;overflow-wrap:anywhere}
.deprow .lbl b{overflow-wrap:anywhere}
.deprow .lbl small{color:var(--muted);font-weight:700}
.dep-track{height:10px;border-radius:6px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.dep-fill{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4c97ff,#1264d6)}
.dark .dep-fill{background:linear-gradient(90deg,#2b63c9,#4c97ff)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;overflow-wrap:anywhere}
.chip b{color:var(--blue)}
.daystats{display:flex;gap:8px;margin:10px 0 2px}
.daystat{flex:1;min-width:0;background:var(--soft);border-radius:10px;padding:8px 9px}
.daystat label{margin-bottom:3px}
.daystat b{font-size:13.5px;overflow-wrap:anywhere}
details.det{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
details.det summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;min-height:40px;font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.3px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::after{content:"\25BE";margin-left:auto;transition:transform .15s}
details.det[open] summary::after{transform:rotate(180deg)}
.detrow{margin-top:8px}
.detrow:last-child{padding-bottom:4px}

function pdfEscape(s){return String(s).replace(/[\\()]/g,'\\$&').replace(/[^\x20-\x7E]/g,'?')}
/* Offline PDF export: the file bytes are assembled right here in the browser
   and handed to the OS through a blob URL \u2014 no server, no library, no network.
   The download works in airplane mode; the preview on screen is the exact
   report selection being exported. */
function savePdf(lines,filename,layout){
  const L=Object.assign({font:'Helvetica',size:10,leading:17,width:595,height:842,x:50,top:790,linesPerPage:42},layout||{});
  const font=L.font==='Courier'?'Courier':'Helvetica';
  const chunks=[];for(let i=0;i<lines.length;i+=L.linesPerPage)chunks.push(lines.slice(i,i+L.linesPerPage));
  if(!chunks.length)chunks.push(['']);
  let objects=['<< /Type /Catalog /Pages 2 0 R >>',''];let pageIds=[];chunks.forEach(page=>{let content='BT\n/F1 '+L.size+' Tf\n'+L.x+' '+L.top+' Td\n';page.forEach((line,i)=>{content+=(i?'0 -'+L.leading+' Td\n':'')+'('+pdfEscape(line)+') Tj\n'});content+='ET';let contentId=objects.length+1;objects.push('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');let pageId=objects.length+1;objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+L.width+' '+L.height+'] /Resources << /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /'+font+' >> >> >> /Contents '+contentId+' 0 R >>');pageIds.push(pageId+' 0 R')});objects[1]='<< /Type /Pages /Kids ['+pageIds.join(' ')+'] /Count '+pageIds.length+' >>';let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let xref=pdf.length;pdf+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n'+offsets.slice(1).map(x=>String(x).padStart(10,'0')+' 00000 n ').join('\n')+'\ntrailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  /* Appending before the click makes it a real save on picky mobile browsers. */
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(e){}},20000);
  toast('PDF downloaded');
}
/* Every report PDF is this statement: one row per date in the period,
   one column per daily entry. A missing entry is a blank column — never 0,
   a dash, or "no entry". WhatsApp share does not use this table. */
const STATEMENT_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function statementLayout(){return {font:'Courier',size:8,leading:11,width:842,height:595,x:16,top:568,linesPerPage:48}}
function statementColumns(){
  return [
    {key:'date',label:'Date',width:6,align:'left'},
    {key:'places',label:'Places',width:6,align:'right'},
    {key:'cash',label:'Cash',width:12,align:'right'},
    {key:'clearing',label:'Clr/BFTN',width:12,align:'right'},
    {key:'rtgs',label:'RTGS',width:11,align:'right'},
    {key:'npsb',label:'NPSB',width:11,align:'right'},
    {key:'agent',label:'Agent',width:12,align:'right'},
    {key:'officers',label:'Officers',width:22,align:'left'},
    {key:'visits',label:'Visits',width:36,align:'left'},
    {key:'accounts',label:'Accounts',width:28,align:'left'}
  ];
}
function monthDates(ref){
  const month=String(ref||'').slice(0,7);
  const y=+month.slice(0,4),m=+month.slice(5,7);
  if(!y||m<1||m>12)return [];
  const n=new Date(y,m,0).getDate(),out=[];
  for(let d=1;d<=n;d++)out.push(month+'-'+String(d).padStart(2,'0'));
  return out;
}
function periodDates(type, ref){
  const day=String(ref||today()).slice(0,10);
  if(type==='daily') return [day];
  if(type==='weekly'){
    const x=new Date(day+'T12:00'), start=new Date(x);
    start.setDate(x.getDate()-x.getDay());
    const out=[];
    for(let i=0;i<5;i++){const d=new Date(start);d.setDate(start.getDate()+i);out.push(d.toISOString().slice(0,10))}
    return out;
  }
  return monthDates(day);
}
function statementKind(type){return type==='daily'||type==='weekly'?type:'monthly'}
function statementHeading(type){return statementKind(type)==='daily'?'DAILY STATEMENT':statementKind(type)==='weekly'?'WEEKLY STATEMENT':'MONTHLY STATEMENT'}
function statementPreviewTitle(type){return statementKind(type)==='daily'?'Daily Statement':statementKind(type)==='weekly'?'Weekly Statement':'Monthly Statement'}
function statementDayLabel(iso){return iso.slice(8,10)+' '+(STATEMENT_MONTHS[(+iso.slice(5,7)||1)-1]||'')}
function amountCell(v){if(v===undefined||v===null||String(v).trim()==='')return '';const n=num(v);return n?money(n):''}
function placesCell(r){if(!r||r.places===undefined||r.places===null||String(r.places).trim()==='')return '';const n=num(r.places);return n?String(n):''}
function officersCell(r){if(!r)return [];return (r.officers||[]).map(o=>[o.name,o.designation].map(x=>String(x||'').trim()).filter(Boolean).join(', ')).filter(Boolean)}
function visitsCell(r){
  if(!r)return [];
  const lines=[];
  (r.visits||[]).forEach(v=>{
    if(![v.officer,v.name,v.address,v.mobile].some(x=>String(x||'').trim()))return;
    const who=[v.officer,v.type].map(x=>String(x||'').trim()).filter(Boolean).join(' | ');
    const place=String(v.name||'').trim();
    const where=[v.address,v.mobile].map(x=>String(x||'').trim()).filter(Boolean).join(' | ');
    [who,place,where].filter(Boolean).forEach(x=>lines.push(x));
  });
  return lines;
}
function accountsCell(r){if(!r)return [];return (r.accounts||[]).filter(a=>num(a.amount)).map(a=>{const bits=[a.category].map(x=>String(x||'').trim()).filter(Boolean);if(num(a.amount))bits.push(money(a.amount));return bits.join(' ')}).filter(Boolean)}
function fitCell(text,width){
  text=String(text==null?'':text).replace(/\s+/g,' ').trim();
  if(!text)return [''];
  const out=[];let rest=text;
  while(rest.length>width){
    let cut=rest.lastIndexOf(' ',width);
    if(cut<=0)cut=width;
    out.push(rest.slice(0,cut).trimEnd());
    rest=rest.slice(cut).trimStart();
    if(!rest)break;
  }
  if(rest)out.push(rest);
  return out.length?out:[''];
}
function padCell(text,width,align){text=String(text||'');if(text.length>width)text=text.slice(0,width);const gap=width-text.length;return align==='right'?' '.repeat(gap)+text:text+' '.repeat(gap)}

function statementRowLines(parts,cols){
  const wrapped=parts.map((lines,i)=>{const src=(lines&&lines.length)?lines:[''];return src.flatMap(line=>fitCell(line,cols[i].width))});
  const h=Math.max(1,...wrapped.map(w=>w.length)),out=[];
  for(let r=0;r<h;r++)out.push(statementLine(wrapped.map(w=>w[r]||''),cols));

}
function packStatement(header,rowGroups,perPage){
  const room=perPage-header.length;
  if(room<1)return header.concat(rowGroups.flat());
  const pages=[];let cur=[];
  function flush(){pages.push(header.concat(cur));cur=[]}
  rowGroups.forEach(group=>{
    let rest=group.length?group.slice():[''];
    while(rest.length){
      const space=room-cur.length;
      if(space<=0){flush();continue}
      if(rest.length<=space){cur.push(...rest);rest=[];continue}
      if(cur.length){flush();continue}
      cur.push(...rest.slice(0,room));
      rest=rest.slice(room);
      flush();
    }
  });
  if(cur.length||!pages.length)flush();
  if(pages.length===1)return pages[0];
  return pages.flatMap(p=>{const page=p.slice();while(page.length<perPage)page.push('');return page});
}
function statementLines(ref, type){
  type=statementKind(type);

  const dates=periodDates(type, ref);
  const title=periodTitle(type, dates[0]||ref||today());
  const rule=cols.map(c=>'-'.repeat(c.width)).join(' ');
  const wanted={};dates.forEach(d=>{wanted[d]=true});
  const by={};
  records.forEach(r=>{if(r&&wanted[r.date])by[r.date]=r});
  const periodRecords=Object.keys(by).sort().map(d=>by[d]);
  const dep=periodRecords.reduce((a,r)=>a+total(r),0);
  const places=periodRecords.reduce((a,r)=>a+num(r.places),0);
  const ac=periodRecords.reduce((a,r)=>a+accountsCount(r),0);
  const acDep=periodRecords.reduce((a,r)=>a+accountsTotal(r),0);
  const header=[
    'FIRST SECURITY ISLAMI BANK PLC',
    String(settings.branch||'Tantar Branch').toUpperCase(),
    statementHeading(type),
    title,
    'Zone: '+(settings.zone||'')+' | Team: '+(settings.team||'')+' | Total Branch: '+(settings.totalBranch||''),
    'Total Deposit: Tk '+money(dep)+' | Places: '+places+' | Accounts: '+ac+' | Account Deposit: Tk '+money(acDep),
    '',
    statementLine(cols.map(c=>c.label),cols),
    rule
  ];
  const sums={places:0,cash:0,clearing:0,rtgs:0,npsb:0,agent:0};
  const groups=[];
  dates.forEach(date=>{
    const r=by[date];
    if(r){sums.places+=num(r.places);sums.cash+=num(r.cash);sums.clearing+=num(r.clearing);sums.rtgs+=num(r.rtgs);sums.npsb+=num(r.npsb);sums.agent+=num(r.agent)}

      [statementDayLabel(date)],
      [placesCell(r)],
      [amountCell(r&&r.cash)],
      [amountCell(r&&r.clearing)],
      [amountCell(r&&r.rtgs)],
      [amountCell(r&&r.npsb)],
      [amountCell(r&&r.agent)],
      officersCell(r),
      visitsCell(r),
      accountsCell(r)
    ],cols));
  });
  groups.push([rule]);
  groups.push(statementRowLines([
    ['TOTAL'],
    [sums.places?String(sums.places):''],
    [sums.cash?money(sums.cash):''],
    [sums.clearing?money(sums.clearing):''],
    [sums.rtgs?money(sums.rtgs):''],
    [sums.npsb?money(sums.npsb):''],
    [sums.agent?money(sums.agent):''],
    [],[],[]
  ],cols));
  groups.push([rule]);
  return packStatement(header,groups,statementLayout().linesPerPage);

/* Generate \u2192 preview \u2192 download. The preview shows the generated report page

let _pdfPending=null;
function previewPDF(lines,filename,title,layout){

  $('#pdfPreviewMeta').textContent=filename+' \u00b7 '+pages.length+' page'+(pages.length>1?'s':'')+' \u00b7 '+lines.length+' lines';
  const wide=L.font==='Courier'?' statement':'';

}

/* ============================================================
   REAL-TIME CLOUD SYNC ENGINE  (offline-first, IndexedDB-backed)
   - Local edits NEVER wait on the network: they land in IndexedDB and
     localStorage first, then queue for upload.
   - One Sync = at most 1 GET + 1 POST (POST only when pendingChanges > 0).
   - DOWNLOAD is real-time: one request is parked on GET /api/live?version=N
     (long-poll). It returns the moment another device saves, so this device
     pulls within seconds. A quiet channel costs one 304 with an empty body
     every LIVE_CONFIG.WAIT_MS, then backs off when the app sits idle.
   - UPLOAD is real-time too: LIVE_CONFIG.UPLOAD_DEBOUNCE_MS after the last
     edit, every time, with no daily gate and no budget. There is no
     Auto-sync switch; uploads are not optional.
   - Manual "Sync Now" / "Refresh from Cloud" is user-initiated and always
     works.
   - Offline: everything keeps working, the parked request is dropped, and the
     queue flushes automatically the moment the device is back online.
   ============================================================ */

/* ---------- deterministic serialization + hash (change detection) ---------- */
function stableStringify(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(stableStringify).join(',')+']';
  const keys=Object.keys(v).sort();
  return '{'+keys.map(k=>JSON.stringify(k)+':'+stableStringify(v[k])).join(',')+'}';
}
function cyrb53(str,seed){
  let h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);
  for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
function genDeviceId(){
  try{
    const a=new Uint8Array(16);crypto.getRandomValues(a);
    a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
    const h=[...a].map(b=>b.toString(16).padStart(2,'0')).join('');
    return 'device-'+h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }catch(e){return 'device-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,14);}
}

/* Canonical form of the cloud document, used only for change detection.

/* ---------- IndexedDB (primary local database) ---------- */
const IDB_NAME='fsib_marketing_db',IDB_VER=1;

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window))return rej(new Error('no-idb'));
    let rq;try{rq=indexedDB.open(IDB_NAME,IDB_VER);}catch(e){return rej(e);}
    rq.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('appData'))db.createObjectStore('appData',{keyPath:'key'});
      if(!db.objectStoreNames.contains('syncMeta'))db.createObjectStore('syncMeta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('syncQueue')){const q=db.createObjectStore('syncQueue',{keyPath:'id',autoIncrement:true});q.createIndex('recordKey','recordKey',{unique:false});}
      if(!db.objectStoreNames.contains('syncLog'))db.createObjectStore('syncLog',{keyPath:'id',autoIncrement:true});
    };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('idb-open'));

function idbReq(store,mode,fn){

    let rq;try{rq=fn(tx.objectStore(store));}catch(e){return rej(e);}
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error('idb-req'));
  });
}

/* ---------- syncMeta (in-memory + IndexedDB + localStorage mirror) ---------- */

/* ---------- syncQueue (only locally-changed records) ---------- */
function mergeQueueRows(a,b){
  const map=new Map();
  (a||[]).concat(b||[]).forEach(q=>{
    if(!q||!q.recordKey||q.syncStatus!=='PENDING')return;
    const cur=map.get(q.recordKey);
    if(!cur||(q.changedAt||'')>=(cur.changedAt||''))map.set(q.recordKey,q);
  });
  return [...map.values()];
}
async function queueLoadAll(){
  let rows=[];

  if(!rows.length){try{rows=JSON.parse(localStorage.getItem(K+'queue')||'[]');}catch(e){rows=[];}}
  _queue=mergeQueueRows(rows,_queue);
  return _queue;
}
function _persistQueueInner(){
  return (async()=>{
    if(!_idb)return;
    try{
      const tx=_idb.transaction('syncQueue','readwrite');const st=tx.objectStore('syncQueue');
      await new Promise((res,rej)=>{const c=st.clear();c.onsuccess=()=>res();c.onerror=()=>rej(c.error);});
      const snap=[..._queue];
      for(const q of snap){const cpy={...q};delete cpy.id;await new Promise((res,rej)=>{const a=st.add(cpy);a.onsuccess=()=>res();a.onerror=()=>rej(a.error);});}
    }catch(e){}
  })();
}

function upsertQueue(entry){

  else if(i>=0){
    const prev=_queue[i].operation;let op=entry.operation;
    if(prev==='CREATE'&&op==='UPDATE')op='CREATE';
    if(prev==='DELETE'&&(op==='CREATE'||op==='UPDATE'))op='UPDATE';
    _queue[i]={..._queue[i],operation:op,changedAt:entry.changedAt,payload:entry.payload,syncStatus:'PENDING'};
  }else{
    _queue.push({recordKey:rk,store:entry.store,recordId:entry.recordId,operation:entry.operation,changedAt:entry.changedAt,payload:entry.payload,syncStatus:'PENDING'});

/** 1500 -> "1.5s", 45000 -> "45s" — the copy must match the actual debounce. */
function fmtSeconds(ms){

/* ---------- dirty state + automatic real-time upload (debounced, never polling) ---------- */
function markDirtyAndSchedule(){

/* ---------- when an edit goes to the cloud ----------
   Every edit uploads LIVE_CONFIG.UPLOAD_DEBOUNCE_MS after the last keystroke,
   automatically, every time — no daily gate, no budget. Two phones typing at
   once converge in seconds. The edit is already on this device (IndexedDB +
   localStorage) before any of this runs, so a blocked upload never loses data.
   Uploads are not optional. window.__fsibHoldUpload is a test seam, not a setting. */
function scheduleAutoUpload(){
  clearTimeout(_debounceT);_debounceT=null;

  try{if(isPublicView())return;}catch(e){}

  _debounceT=setTimeout(()=>{maybeAutoUpload('edit');},LIVE_CONFIG.UPLOAD_DEBOUNCE_MS);

/* An edit must reach the cloud before the phone goes back in a pocket: background
   tabs throttle timers, so the 1.5s debounce can stretch to a minute once the app
   is hidden. Sending it now is what makes the other phone see the entry while the
   officer is still standing there. */

  if(uploadsHeld())return false;
  if(!navigator.onLine)return false;
  try{if(isPublicView())return false;}catch(e){}
  if(pendingCount()<=0)return false;

  return true;
}

  if(!navigator.onLine)return false;
  try{if(isPublicView())return false;}catch(e){}
  if(pendingCount()<=0)return false;

/* ---------- /api/sync transport (Netlify Blobs backend) ----------
   Mirrors src/lib/cloud-api.ts. index.html is a no-build PWA shell, so it
   carries this inline copy of the same wire contract; keep the two in step.
   GET  -> {settings, records, trash, version, updatedAt}
   POST -> {settings, records, trash, version, force} -> new state, 409 on stale version */
function emptyCloudState(){return {settings:{},records:[],trash:[],version:0,updatedAt:null}}

  const skip=(SYNC_CONFIG.DEVICE_ONLY_SETTING_KEYS||[]).concat(SYNC_CONFIG.RETIRED_SYNC_SETTING_KEYS||RETIRED_SYNC_SETTING_KEYS||[]);
  const o={};
  Object.keys(s||{}).forEach(k=>{if(skip.indexOf(k)>=0)return;o[k]=s[k]});

async function cloudGet(){
  const r=await fetch(CLOUD_API,{method:'GET',headers:{accept:'application/json'},cache:'no-store'});

  if(!r.ok){const t=await r.text().catch(()=> '');throw new Error('GET '+r.status+' '+String(t||'').slice(0,120));}
  const j=(await r.json())||{};
  /* The deployed /api/sync wraps the document in {ok,empty,state}; accept that and
     the bare document, so this client works against either server. */
  const d=(j&&typeof j==='object'&&j.state&&typeof j.state==='object')?j.state:j;
  if(j&&j.empty===true&&!(j.state&&typeof j.state==='object'))return {found:false,state:emptyCloudState()};
  return {found:true,state:{
    settings:(d&&d.settings)||{},
    records:Array.isArray(d&&d.records)?d.records:[],

    force:force===true

/* ---------- real-time channel: /api/live long-poll ----------
   One request at a time is parked on the server holding our cloud version.
   It returns the instant another device saves, so this device pulls within a
   second or two instead of at the next daily sync. A 304 means "still quiet"
   and costs nothing but the hold itself.

   The channel is pure signalling: it never carries data, so a lost connection
   can never lose an edit. If /api/live is missing (an older deploy) the loop
   backs off and the app behaves exactly as it did before. */
let _live={
  state:'off',          // off | starting | watching | updating | error | disabled
  version:-1,           // cloud version we hold; -1 = unknown, ask for a baseline
  abort:null,
  timer:null,
  token:0,              // generation guard: only the newest loop may keep going

    let res=await cloudSave(payload,baseVersion,force);
    if(!res.ok&&res.status===409&&!force){
      /* Another device saved between our GET and POST: re-read, re-merge, retry once. */
      await addSyncLog('Conflict','Server moved to version '+res.currentVersion+' while we sent '+baseVersion+'. Re-merging and retrying.');
      const g2=await cloudGet();
      merged=mergeWithCloud(g2.state);
      payload=buildCloudPayload(merged);
      baseVersion=g2.state.version;
      res=await cloudSave(payload,baseVersion,false);
    }
    if(!res.ok)throw new Error((res.error||'save-failed')+(res.message?(' \u2014 '+res.message):''));
    const saved=res.state||{};
    const newVersion=Number(saved.version)||baseVersion;
    setCloudVersion(newVersion);
    adoptMergedLocally(merged);
    /* Publish the new hash before clearing the queue: reconcileQueue() compares the
       local hash with lastCloudHash, so doing this first stops a startup reconcile
       from re-queueing the very records this sync just uploaded. */
    await afterCloudWrite(saved,cloudContentHash({records:merged.records,trash:merged.trash,settings:payload.settings}));
    if(pending.length)await markChangesAsSynced(pending.map(p=>({recordKey:p.recordKey,changedAt:p.changedAt})));
    if(merged.conflicts&&merged.conflicts.length){
      const prev=Array.isArray(_meta.conflicts)?_meta.conflicts:[];
      await metaPut('conflicts',merged.conflicts.concat(prev).slice(0,20));
      await addSyncLog('Conflicts resolved',merged.conflicts.length+' day(s) changed on two devices \u2014 newest kept: '+merged.conflicts.map(c=>c.recordId).join(', '));
    }
    await addSyncLog(auto?'Auto sync':'Sync successful','Uploaded to cloud (version '+newVersion+'). Records uploaded: '+pending.length+(cloudChanged?' \u00b7 Cloud changes merged':''),{uploaded:pending.length});
    setSyncStatus(pendingCount()>0?'pending':'synced');
    refreshAfterSync();
    if(explicit||reason==='startup')toast('Synced ('+pending.length+' uploaded, version '+newVersion+')');
    else if(auto)liveToast('Auto-uploaded \u2014 '+pending.length+' change(s), cloud v'+newVersion);
    return {uploaded:pending.length,version:newVersion,downloaded:cloudChanged};
  }catch(err){
    console.error('sync failed',err);
    setSyncStatus('error',(err&&err.message)||'error');
    await addSyncLog('Sync failed',String((err&&err.message)||err).slice(0,180)+' \u2014 local data is safe, '+pendingCount()+' change(s) waiting.');
    if(reason==='manual'||reason==='refresh'||reason==='retry')toast('Sync failed. Your local data is safe. '+pendingCount()+' change(s) waiting to sync.');
    else if(auto){
      /* No toast storm while someone is typing: the button already shows the
         error, and the upload retries by itself. */
      clearTimeout(_debounceT);
      _debounceT=setTimeout(()=>{maybeAutoUpload('retry');},LIVE_CONFIG.RETRY_BASE_MS);
    }
    return {error:err};
  }finally{
    _syncInProgress=false;updateSyncUI();
    /* Something was edited while this sync was in flight: send it now instead
       of waiting for the next live tick. */
    if(pendingCount()>0)scheduleAutoUpload();
  }
}

/* ---------- sync log (local only, capped) ---------- */
async function addSyncLog(event,detail,extra){
  const e={at:new Date().toISOString(),event:event,detail:detail||'',uploaded:(extra&&extra.uploaded)||0,downloaded:(extra&&extra.downloaded)||0};
  _syncLog.unshift(e);_syncLog=_syncLog.slice(0,SYNC_CONFIG.MAX_SYNC_LOG||30);
  try{localStorage.setItem(K+'syncLog',JSON.stringify(_syncLog));}catch(e){}
  if(_idb){try{
    await new Promise((res,rej)=>{const a=_idb.transaction('syncLog','readwrite').objectStore('syncLog').add(e);a.onsuccess=()=>res();a.onerror=()=>rej(a.error);});
    const all=await idbReq('syncLog','readonly',s=>s.getAll());
    if(all&&all.length>(SYNC_CONFIG.MAX_SYNC_LOG||30)){
      const over=all.slice(0,all.length-(SYNC_CONFIG.MAX_SYNC_LOG||30));
      const tx2=_idb.transaction('syncLog','readwrite');over.forEach(r=>tx2.objectStore('syncLog').delete(r.id));
    }
  }catch(e){}}
  updateSyncUI();
}
async function loadSyncLog(){
  try{const all=await idbReq('syncLog','readonly',s=>s.getAll());if(all&&all.length){_syncLog=all.sort((a,b)=>(a.at<b.at?1:-1)).slice(0,SYNC_CONFIG.MAX_SYNC_LOG||30);return _syncLog;}}catch(e){}
  try{_syncLog=JSON.parse(localStorage.getItem(K+'syncLog')||'[]');}catch(e){_syncLog=[];}
  return _syncLog;
}

/* ---------- migration: LocalStorage -> IndexedDB (once, data preserved) ---------- */
async function initLocalDB(){
  try{_idb=await idbOpen();}catch(e){_idb=null;}
  await metaLoadAll();
  if(!_meta.deviceId){
    let dev='';try{dev=localStorage.getItem(K+'deviceId')||'';}catch(e){}
    if(!dev)dev=genDeviceId();
    await metaPut('deviceId',dev);
    try{localStorage.setItem(K+'deviceId',dev);}catch(e){}
  }else{try{localStorage.setItem(K+'deviceId',_meta.deviceId);}catch(e){}}
  await queueLoadAll();
  await loadSyncLog();
  /* tombstones were a JSONBin-era delete log; the synced trash list replaced
     them — drop any leftover so an upgrading device starts clean. */
  try{localStorage.removeItem(K+'tombstones');}catch(e){}
  try{await idbReq('appData','readwrite',s=>s.delete('tombstones'));}catch(e){}
  const idbRecords=await kvGet('records');
  if(idbRecords===undefined||idbRecords===null){
    await persistLocalInner();
    if(!_meta.migrated_v2&&records&&records.length){
      const now=new Date().toISOString();
      records.forEach(r=>{if(r&&r.date)upsertQueue({store:'records',recordId:r.date,operation:'CREATE',changedAt:r.updated||now,payload:JSON.parse(JSON.stringify(r))});});
      await persistQueueNow();
    }
    await metaPut('migrated_v2',true);
  }else{
    const idbTrash=(await kvGet('trash'))||[];
    const idbSettings=(await kvGet('settings'))||null;
    const idbSeq=(idbSettings&&idbSettings._seq)||0,lsSeq=settings._seq||0;
    if(lsSeq>=idbSeq){
      await persistLocalInner();
    }else{
      records=idbRecords;trash=idbTrash;settings={...settings,...idbSettings};
      try{localStorage.setItem(K+'records',JSON.stringify(records));localStorage.setItem(K+'trash',JSON.stringify(trash));localStorage.setItem(K+'settings',JSON.stringify(settings));}catch(e){}
    }
  }
  if(scrubRetiredSyncSettings()){
    try{localStorage.setItem(K+'settings',JSON.stringify(settings));}catch(e){}
    try{await kvPut('settings',settings);}catch(e){}
  }
  if(!settings.settingsUpdatedAt)settings.settingsUpdatedAt=new Date().toISOString();
  _meta.requestsUsed=_meta.requestsUsed||0;
  await reconcileQueue();
  const n=pendingCount();_meta.pendingChanges=n;
  if(_meta.lastSyncAt&&!settings.lastSync)settings.lastSync=_meta.lastSyncAt;
  if(settings.lastSync&&!_meta.lastSyncAt)_meta.lastSyncAt=settings.lastSync;
  _syncStatus=!navigator.onLine?'offline':(n>0?'pending':'synced');
  _meta.syncStatus=_syncStatus;
  await persistQueueNow();
  updateSyncUI();
}
async function reconcileQueue(){
  try{
    const h=computeLocalHash();
    if(h===(_meta.lastCloudHash||''))return;
    const keys=new Set((_queue||[]).map(q=>q.recordKey));
    let added=0;const now=new Date().toISOString();
    records.forEach(r=>{if(r&&r.date&&!keys.has('records:'+r.date)){upsertQueue({store:'records',recordId:r.date,operation:'UPDATE',changedAt:r.updated||now,payload:JSON.parse(JSON.stringify(r))});added++;}});
    if(added){await persistQueueNow();await addSyncLog('Queue repaired',added+' local change(s) re-queued after restart.');}
  }catch(e){}
}

/* ---------- sync UI ---------- */
/* The header dot is the honest signal: it says whether this device is actually
   parked on the cloud right now, not merely whether a sync button exists. */
function liveBadgeMeta(){
  if(!navigator.onLine)return {cls:'off',text:'OFFLINE',title:'Offline \u00b7 edits are safe on this device and upload when you reconnect'};
  if(_live.notSupported)return {cls:'warn',text:'NO LIVE',title:'This server has no /api/live endpoint \u00b7 edits still upload automatically'};
  switch(_live.state){
    case 'watching':return {cls:'live',text:'LIVE',title:liveStatusText()+' \u00b7 another device\u2019s edit appears here within seconds'};
    case 'updating':return {cls:'busy',text:'UPDATING',title:'Pulling changes from the cloud right now'};
    case 'starting':return {cls:'busy',text:'CONNECTING',title:'Opening the real-time channel'};
    case 'error':return {cls:'err',text:'RETRY',title:'Real-time channel error: '+(_live.lastError||'unknown')+' \u00b7 retrying automatically'};
    default:return {cls:'off',text:'LIVE OFF',title:'Real-time channel idle'};
  }
}
function updateLiveBadge(){
  const el=document.getElementById('liveBadge');
  if(!el)return;
  const m=liveBadgeMeta();
  el.className='livedot '+m.cls;
  el.title=m.title;
  const t=document.getElementById('liveBadgeText');
  if(t)t.textContent=m.text;
}
function fmtSyncTime(iso){
  if(!iso)return 'Never';
  try{return new Date(iso).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return String(iso);}
}
function syncStatusMeta(){
  const n=pendingCount();
  if(!navigator.onLine)return {key:'offline',label:n>0?('\u25cb Offline \u00b7 '+n+' saved'):('\u25cb Offline'),cls:'offline'};
  if(_syncInProgress)return {key:'syncing',label:'\u21bb Syncing\u2026',cls:'syncing'};
  if(_syncStatus==='error')return {key:'error',label:'! Sync failed'+(n>0?(' \u00b7 '+n+' waiting'):''),cls:'error'};
  if(n>0)return {key:'pending',label:'\u2601 '+n+' pending',cls:'pending'};
  return {key:'synced',label:'\u2601 Synced',cls:''};
}
function updateSyncUI(){
  try{updateLiveBadge();}catch(e){}
  try{
    const m=syncStatusMeta();
    const top=document.querySelector('header.top');
    if(top){
      const syncedOnline=m.key==='synced';
      top.classList.toggle('online-synced',syncedOnline);
      top.title=syncedOnline?'Online and synced':'';

    const modal=document.getElementById('syncModal');
    if(modal&&modal.classList.contains('show'))renderSyncDetails();

}
function syncPanelHtml(){
  const m=syncStatusMeta();

  const conf=Array.isArray(_meta.conflicts)?_meta.conflicts:[];

    +'<div>Status: <b>'+esc(m.label)+'</b></div>'
    +'<div>Real-time: <b>'+esc(liveStatusText())+'</b></div>'
    +'<div>Live hold: <b>'+Math.round(liveAskWaitMs()/1000)+'s</b>'+(Number(_live.serverMaxWaitMs)>0?(' of '+Math.round(_live.serverMaxWaitMs/1000)+'s this server allows'):'')+'</div>'
    +(_live.lastChangeAt?('<div>Last cloud change seen: <b>'+esc(fmtSyncTime(_live.lastChangeAt))+'</b> \u00b7 '+_live.changesApplied+' live update(s) this session</div>'):'')
    +'<div>Last Sync: <b>'+esc(fmtSyncTime(_meta.lastSyncAt||settings.lastSync))+'</b></div>'
    +'<div>Pending Changes: <b>'+pendingCount()+'</b></div>'
    +'<div>Uploads: <b>'+esc(autoSyncStatusText())+'</b></div>'
    +'<div>Cloud version: <b>'+esc(String(getCloudVersion()||'not synced yet'))+'</b></div>'
    +'<div>Cloud host: <b>'+esc(CLOUD_ORIGIN?CLOUD_ORIGIN:'this site')+'</b></div>'
    +'<div>This device: <span class="small">'+esc(_meta.deviceId||'\u2014')+'</span></div>'
    +rate
    +(conf.length?'<div>Conflicts (newest kept): '+esc(conf.slice(0,5).map(c=>c.recordId).join(', '))+(conf.length>5?'\u2026':'')+'</div>':'')
    +'</div>';
}
function syncLogText(){
  if(!_syncLog.length)return 'No sync activity yet.';
  return _syncLog.slice(0,12).map(e=>fmtSyncTime(e.at)+' \u2014 '+e.event+(e.detail?(' \u00b7 '+e.detail):'')).join('\n');
}
function renderSyncDetails(){
  const m=syncStatusMeta();
  document.getElementById('syncDetails').innerHTML='<div class="syncmeta">'
    +'<div>Status: <b>'+esc(m.label)+'</b></div>'

    +'<div>Last Sync: <b>'+esc(fmtSyncTime(_meta.lastSyncAt||settings.lastSync))+'</b></div>'

    +'<div>Uploads: <b>'+esc(autoSyncStatusText())+'</b></div>'

  document.getElementById('syncLogMini').textContent=_syncLog.slice(0,8).map(e=>fmtSyncTime(e.at)+' \u2014 '+e.event+(e.detail?(' \u00b7 '+e.detail):'')).join('\n')||'No sync activity yet.';
  const sb=document.getElementById('syncNowBtn');

function refreshAfterSync(){
  try{renderDashboard();}catch(e){}
  try{
    const active=(document.querySelector('.page.active')||{}).id||'dashboard';
    if(active==='history')renderHistory();
    else if(active==='reports')renderReports();
    else if(active==='settings')renderSettings();

function wireSyncUI(){

  if(lb)lb.onclick=()=>{renderSyncDetails();document.getElementById('syncModal').classList.add('show');};

/* ---------- public read-only view ----------
   GET /api/sync is public by design (no credential ships in the page), so a share
   link needs no bin id: <site>/?view=1 renders the cloud state read-only. */
function publicViewUrl(){return location.origin+location.pathname.replace(/index\.html$/,'')+'?view=1'}
function isPublicView(){try{return new URLSearchParams(location.search).get('view')!==null}catch(e){return false}}
async function pullCloud(){return syncNow('refresh');}
async function pushCloud(){return syncNow('manual');}

async function loadPublicView(){
  try{
    const g=await cloudGet();
    const d=g.state||emptyCloudState();
    records=Array.isArray(d.records)?d.records:[];
    trash=[];
    if(d.settings&&typeof d.settings==='object'){
      settings={...settings,...d.settings,autoLock:0};
      scrubRetiredSyncSettings();
      setPinValue('');
    }
    /* A shared link is read-only, so it must not look like it owes the cloud
       anything. The migration in initLocalDB queues whatever `records` holds on
       first run — and loadPublicView has already filled it with the cloud's own
       rows, which would sit there as "pending" forever (and upload them back to
       itself if this browser ever opened the app normally). */
    _queue=[];
    await persistQueueNow();
    _meta.pendingChanges=0;
    await metaPut('pendingChanges',0);
    document.body.classList.add('public-view');
    const ban=document.createElement('div');
    ban.id='publicBanner';
    ban.style.cssText='position:sticky;top:0;z-index:50;background:#06377d;color:#fff;padding:10px 14px;font-size:13px;font-weight:700;text-align:center';
    ban.textContent='Public view \u2014 read only \u00b7 FSIB Branch Marketing Report';
    document.body.insertBefore(ban,document.body.firstChild);
    const ib=document.getElementById('installBtn');if(ib)ib.classList.add('hidden');
    setCloudVersion(d.version);
    _live.version=Number(d.version)||0;
    renderDashboard();
    updateSyncUI();
    toast('Public report loaded ('+records.length+' days)');
    /* A shared link left open on a wall screen should follow the branch's
       latest report without anyone refreshing it. */
    startLiveWatch();
  }catch(e){console.error(e);toast('Public load failed')}
}



function network(){
  let on=navigator.onLine;
  $('#netStatus').textContent=on?'ONLINE':'OFFLINE MODE';
  $('#netStatus').classList.toggle('offline',!on);
  if(!on){
    /* Drop the parked request instead of letting it time out and count as a
       failure; the edits are already safe on this device. */
    if(_live.state!=='disabled')liveStop('offline');
    if(_syncStatus!=='offline'){_syncStatus='offline';updateSyncUI();}
    return;
  }
  if(_syncStatus==='offline'){_syncStatus=pendingCount()>0?'pending':'synced';updateSyncUI();}
}
/* Coming back from offline: re-open the live channel, push what queued up, and
   look for anything another phone saved while this one had no signal. This runs
   on the online EVENT only — the boot path has its own syncNow('startup'), and
   two catch-ups racing at launch is how a live pull ends up skipped as busy. */
function networkReturned(){
  if(!navigator.onLine)return;
  _live.notSupported=false;_live.fails=0;
  startLiveWatch();
  if(!maybeAutoUpload('online'))syncNow('online').catch(()=>{});
}
addEventListener('online',()=>{network();networkReturned();});addEventListener('offline',network);let deferredPrompt=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    /* Background tabs must not hold a parked request: browsers throttle timers
       and kill sockets, which would only produce retries nobody can see. */
    _hiddenAt=Date.now();
    flushUploadsNow('hidden');
    liveStop();
    return;
  }
  _live.notSupported=false;
  startLiveWatch();
  maybeAutoUpload('visible');
  /* Returning to a tab that was away for a while: do not wait for the parked
     request to answer — check the cloud now, so the screen the user is looking
     at is current the moment they look at it. */
  if(_hiddenAt&&(Date.now()-_hiddenAt)>=LIVE_CONFIG.RESUME_CATCHUP_AFTER_MS){
    _hiddenAt=0;
    syncNow('visible').catch(()=>{});
  }
  _hiddenAt=0;
});
window.addEventListener("beforeinstallprompt",event=>{
  event.preventDefault();
  deferredPrompt=event;
  const installButton=document.getElementById("installBtn");
  if(installButton){installButton.classList.remove("hidden");}

document.getElementById("installBtn")?.addEventListener("click",async()=>{

  if(result.outcome==="accepted"){console.log("FSIB Marketing installed");}

window.addEventListener("appinstalled",()=>{
  deferredPrompt=null;

});
function isInstalledPWA(){
  return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
}
if(isInstalledPWA()){
  document.getElementById("installBtn")?.classList.add("hidden");
}
let _swReloaded=false;
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./service-worker.js",{scope:"./",updateViaCache:"none"})
      .then(registration=>{
        console.log("FSIB Marketing PWA registered:",registration.scope);
        /* Check for a new build on every launch instead of waiting for the
           browser's own schedule. */
        try{registration.update();}catch(e){}
      })
      .catch(error=>{
        console.error("FSIB Marketing PWA registration failed:",error);
      });
  });
  /* A new service worker taking over an already-installed app: reload once so
     this phone is running the build it just downloaded. This is what breaks the
     "device B is still running last month's app" loop — an old cache-first
     worker would otherwise keep serving the stale shell forever. */
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(_swReloaded)return;_swReloaded=true;
      try{location.reload();}catch(e){}
    });
  }
}

/* ---------- mobile modal UX: tap outside to dismiss, Escape to close, background scroll lock ---------- */
function syncModalLock(){document.body.classList.toggle('modal-open',$$('.modal.show').length>0)}
function wireModalUX(){
  ['syncModal','reportModal'].forEach(id=>{
    const m=document.getElementById(id);
    if(!m)return;
    m.addEventListener('click',e=>{if(e.target===m){m.classList.remove('show');syncModalLock()}});
  });
  $$('.modal').forEach(m=>new MutationObserver(syncModalLock).observe(m,{attributes:true,attributeFilter:['class']}));
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    const open=$$('.modal.show').filter(m=>m.id!=='pinModal');
    if(open.length){open[open.length-1].classList.remove('show');syncModalLock()}
  });
  syncModalLock();
}
theme();renderDashboard();resetLock();
wireSyncUI();
wireModalUX();
/* Open the local store BEFORE anything can talk to the cloud: syncNow() waits
   on this promise, and a network() that ran first would download the cloud's
   own rows into a device whose first-run migration had not happened yet —
   which then queued those rows straight back up as "local data". */
_initPromise=initLocalDB();
network();
_initPromise.then(()=>{
  refreshAfterSync();
  updateSyncUI();
  if(isPublicView()){loadPublicView();return;}
  /* Open the real-time channel first: it is what makes the rest of the app
     converge without anyone tapping Sync. The safety net runs underneath it, in
     case this host cannot hold a request at all. */
  startLiveWatch();
  startFallbackWatch();
  /* On open, with nobody tapping Sync: anything queued goes up and whatever
     the cloud has comes down. */
  if(navigator.onLine&&!uploadsHeld())setTimeout(()=>{syncNow('startup').catch(()=>{});},700);
}).catch(e=>{console.error('local db init failed',e);updateSyncUI();});
